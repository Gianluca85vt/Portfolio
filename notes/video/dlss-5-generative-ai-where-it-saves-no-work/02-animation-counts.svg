<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B600A8"/><stop offset="100%" stop-color="#BE4C00"/>
    </linearGradient>
  </defs>
  <text x="120" y="150" font-family="Kanit, 'Arial Black', sans-serif" font-size="30" font-weight="600" letter-spacing="10" fill="#B600A8">ANIMATIONS IN THE DATABASE</text>
  <text x="120" y="286" font-family="Kanit, 'Arial Black', sans-serif" font-size="34" font-weight="600" fill="#F4F1F6">GTA 5 — 2013</text>
  <rect x="120" y="300" width="120.99999999999999" height="46" rx="4" fill="rgba(244,241,246,0.22)"/>
  <text x="267" y="336" font-family="Kanit, 'Arial Black', sans-serif" font-size="44" font-weight="800" fill="rgba(244,241,246,0.45)">55,000</text>
  <text x="120" y="436" font-family="Kanit, 'Arial Black', sans-serif" font-size="34" font-weight="600" fill="#F4F1F6">Red Dead Redemption 2 — 2018</text>
  <rect x="120" y="450" width="660" height="46" rx="4" fill="rgba(244,241,246,0.22)"/>
  <text x="806" y="486" font-family="Kanit, 'Arial Black', sans-serif" font-size="44" font-weight="800" fill="rgba(244,241,246,0.45)">~300,000</text>
  <text x="120" y="586" font-family="Kanit, 'Arial Black', sans-serif" font-size="34" font-weight="600" fill="#F4F1F6">GTA 6 — 2026</text>
  <rect x="120" y="600" width="1320" height="46" rx="4" fill="url(#accent)"/>
  <text x="1466" y="636" font-family="Kanit, 'Arial Black', sans-serif" font-size="44" font-weight="800" fill="#F4F1F6">600,000+</text>
  <text x="120" y="790" font-family="Kanit, 'Arial Black', sans-serif" font-size="30" fill="rgba(244,241,246,0.45)">Rockstar's own figure for GTA 6. The Red Dead number is disputed.</text>
</svg>