  <text x="120" y="802" font-family="Kanit, 'Arial Black', sans-serif" font-size="32" font-weight="600" fill="#B600A8">Maxon's safeguards are documented in the 2026.4 release. Capcom's plan was presented as strategy, so the comparison is a shipped feature against an intention.</text>
