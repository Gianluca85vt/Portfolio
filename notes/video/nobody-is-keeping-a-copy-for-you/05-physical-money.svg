  </defs>
  <text x="120" y="150" font-family="Kanit, 'Arial Black', sans-serif" font-size="30" font-weight="600" letter-spacing="10" fill="#B600A8">US RECORDED MUSIC, H1 2026</text>
  <text x="120" y="286" font-family="Kanit, 'Arial Black', sans-serif" font-size="34" font-weight="600" fill="#F4F1F6">CD revenue</text>
  <rect x="120" y="300" width="1320" height="46" rx="4" fill="rgba(244,241,246,0.22)"/>
  <text x="1466" y="336" font-family="Kanit, 'Arial Black', sans-serif" font-size="44" font-weight="800" fill="rgba(244,241,246,0.45)">+58.6%</text>
