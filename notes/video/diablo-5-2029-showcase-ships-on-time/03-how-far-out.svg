  <text x="120" y="790" font-family="Kanit, 'Arial Black', sans-serif" font-size="30" fill="rgba(244,241,246,0.45)">The Worldsoul Saga was announced as a trilogy at BlizzCon 2023. The third part still has no window.</text>
