  <text x="324.5" y="598" text-anchor="middle" font-family="Kanit, 'Arial Black', sans-serif" font-size="34" font-weight="600" fill="#F4F1F6">BioWare closed</text>
  <rect x="545" y="520" width="389" height="130" rx="10" fill="rgba(244,241,246,0.08)" stroke="rgba(244,241,246,0.22)" stroke-width="2"/>
