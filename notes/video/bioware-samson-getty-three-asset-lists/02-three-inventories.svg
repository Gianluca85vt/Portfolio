  <text x="130" y="740" font-family="Kanit, 'Arial Black', sans-serif" font-size="32" fill="rgba(244,241,246,0.45)">EA closed BioWare 21 October. Liquid Swords declared bankrupt in Stockholm 12 October, bids on Samson open until month's end. Getty filed Chapter 11 in Delaware 21 October.</text>
