<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Final Fantasy Resonance reviews span six to ten">
  <defs>
    <linearGradient id="bgffr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#5A0F2A"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
    <linearGradient id="accffr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D6294E"/>
      <stop offset="100%" stop-color="#FFC9A8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgffr)"/>

  <!-- score spread: nine marks from 6 to 10 -->
  <g stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5">
    <line x1="140" y1="640" x2="1060" y2="640"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.75">
    <circle cx="140" cy="640" r="9"/>
    <circle cx="140" cy="640" r="9"/>
    <circle cx="370" cy="640" r="9"/>
    <circle cx="485" cy="640" r="9"/>
    <circle cx="485" cy="640" r="9"/>
    <circle cx="485" cy="640" r="9"/>
    <circle cx="715" cy="640" r="9"/>
    <circle cx="715" cy="640" r="9"/>
    <circle cx="1060" cy="640" r="9"/>
  </g>
  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#FFFFFF" fill-opacity="0.5" font-size="24">
    <text x="140" y="690">6</text>
    <text x="1060" y="690">10</text>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="600" y="140" font-size="26" letter-spacing="7" fill="#FFFFFF" fill-opacity="0.45">NINE VERDICTS, FOUR-POINT SPREAD</text>

    <text x="600" y="300" font-size="86" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">6 TO 10</text>

    <text x="600" y="400" font-size="40" fill="#FFFFFF" fill-opacity="0.75">FINAL FANTASY RESONANCE</text>
    <text x="600" y="460" font-size="28" fill="#FFFFFF" fill-opacity="0.55">A BRAVE EXVIUS ARC REBUILT IN HD-2D</text>
  </g>

  <rect x="500" y="510" width="200" height="8" rx="4" fill="url(#accffr)"/>
</svg>
