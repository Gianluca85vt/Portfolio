<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Castlevania: Belmont's Curse divides on its map">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#3A0F1E"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D6294E"/>
      <stop offset="100%" stop-color="#BE4C00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2">
    <path d="M0 150H1200M0 210H1200M0 270H1200"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="150" fill="#FFFFFF" fill-opacity="0.62" font-size="34" letter-spacing="7">CASTLEVANIA</text>
    <text x="600" y="214" fill="#FFFFFF" fill-opacity="0.9" font-size="52" font-weight="bold">BELMONT&#8217;S CURSE</text>

    <text x="600" y="430" fill="#FFFFFF" font-size="210" font-weight="bold">8.5</text>
    <text x="600" y="500" fill="#FFFFFF" fill-opacity="0.78" font-size="40" letter-spacing="3">12 VERDICTS, 6 TO 10</text>

    <rect x="400" y="552" width="400" height="5" fill="url(#accent)"/>

    <text x="600" y="640" fill="#FFFFFF" fill-opacity="0.72" font-size="33">Everyone agrees about the art.</text>
    <text x="600" y="686" fill="#FFFFFF" fill-opacity="0.72" font-size="33">The argument is the map.</text>
  </g>
</svg>
