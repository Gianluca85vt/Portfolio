      <stop offset="0" stop-color="#18011F"/>
      <stop offset="1" stop-color="#1F6F6B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <text x="90" y="150" fill="#9FE8E2" font-family="Helvetica, Arial, sans-serif" font-size="30" letter-spacing="6">FRAME TIMES</text>
