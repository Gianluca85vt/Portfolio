<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="The Cat in the Hat review: six verdicts average 5.8">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#18011F"/>
      <stop offset="1" stop-color="#5B3FBF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <text x="80" y="150" fill="#E7DCFF" font-family="Helvetica, Arial, sans-serif" font-size="34" letter-spacing="6">FILM &amp; TV — REVIEW</text>
  <text x="80" y="330" fill="#FFFFFF" font-family="Helvetica, Arial, sans-serif" font-size="190" font-weight="700">5.8</text>
