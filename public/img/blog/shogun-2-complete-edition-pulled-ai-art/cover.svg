<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Sega pulled Total War: Shogun 2 Complete Edition two days after launch">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#3A0F1E"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <text x="80" y="150" fill="#F2A0B2" font-family="Helvetica,Arial,sans-serif" font-size="32" letter-spacing="6">TOTAL WAR: SHOGUN 2</text>
  <text x="80" y="320" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="170" font-weight="bold">2 days</text>
  <text x="80" y="392" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="44">on sale before Sega pulled it</text>
  <text x="80" y="452" fill="#F2A0B2" font-family="Helvetica,Arial,sans-serif" font-size="34">and put the 2011 original back up</text>
</svg>
