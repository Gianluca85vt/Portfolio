<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Halloween: The Game sits at 75 on Metacritic and 56 on OpenCritic from eight reviews">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#3A0F1E"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D6294E"/>
      <stop offset="100%" stop-color="#BE4C00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2">
    <path d="M0 170H1200M0 232H1200M0 294H1200"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="140" font-size="26" letter-spacing="7" fill="#FFFFFF" fill-opacity="0.55"
          font-weight="bold">HALLOWEEN: THE GAME</text>

    <text x="350" y="320" font-size="150" font-weight="900" fill="#FFFFFF">75</text>
    <text x="850" y="320" font-size="150" font-weight="900" fill="#FFFFFF" fill-opacity="0.72">56</text>

    <text x="350" y="372" font-size="27" fill="#FFFFFF" fill-opacity="0.6" font-weight="bold"
          letter-spacing="3">METACRITIC</text>
    <text x="850" y="372" font-size="27" fill="#FFFFFF" fill-opacity="0.6" font-weight="bold"
          letter-spacing="3">OPENCRITIC</text>

    <text x="600" y="452" font-size="34" font-weight="900" fill="#FFFFFF" fill-opacity="0.9">
      EIGHT REVIEWS, NINETEEN POINTS APART
    </text>
  </g>

  <rect x="588" y="230" width="24" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.25"/>
  <rect x="480" y="500" width="240" height="8" rx="4" fill="url(#accent)"/>
</svg>
