<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Raspberry Pi 5 RAM lock: why a swap won't boot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#3B1060"/>
      <stop offset="100%" stop-color="#7621B0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C77DFF"/>
      <stop offset="100%" stop-color="#EBD4FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <text x="90" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="6" fill="#C77DFF" opacity="0.85">RASPBERRY PI 5</text>

  <text x="90" y="335" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="150" font-weight="700" fill="url(#accent)">SDRAM</text>
  <text x="90" y="465" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="150" font-weight="700" fill="url(#accent)">mismatch</text>

  <rect x="90" y="520" width="170" height="4" fill="#C77DFF" opacity="0.7"/>

  <text x="90" y="605" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="600" fill="#FFFFFF">EEPROM build 23 Sep 2024</text>
  <text x="90" y="665" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#E6D2F5" opacity="0.88">the fuses decide what is on the board</text>
</svg>
