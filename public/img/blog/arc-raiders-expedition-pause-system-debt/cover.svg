<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Arc Raiders pauses its Expedition wipe system until early 2027">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#3A0F1E"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D6294E"/>
      <stop offset="100%" stop-color="#BE4C00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- faint horizontal scan lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2">
    <path d="M0 160H1200M0 220H1200M0 280H1200"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="150" font-size="28" letter-spacing="7" fill="#FFFFFF" fill-opacity="0.55"
          font-weight="bold">ARC RAIDERS</text>

    <text x="600" y="300" font-size="82" font-weight="900" fill="#FFFFFF">EXPEDITIONS</text>
    <text x="600" y="375" font-size="46" font-weight="900" fill="#FFFFFF" fill-opacity="0.92">PAUSED UNTIL 2027</text>

    <text x="600" y="450" font-size="28" fill="#FFFFFF" fill-opacity="0.55" font-weight="bold">
      "WE DIDN'T HAVE TIME TO BUILD IT RIGHT"
    </text>
  </g>

  <rect x="480" y="500" width="240" height="8" rx="4" fill="url(#accent)"/>
</svg>
