<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Enola Holmes 3, invisible VFX">
  <defs>
    <linearGradient id="bgEnola" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#26123F"/>
      <stop offset="100%" stop-color="#5B3FBF"/>
    </linearGradient>
    <linearGradient id="accentEnola" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B3FBF"/>
      <stop offset="100%" stop-color="#B600A8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgEnola)"/>

  <!-- faint mirror-frame rectangle, upper right -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="10">
    <rect x="820" y="60" width="320" height="420" rx="10"/>
  </g>

  <!-- fingerprint-smudge dots, scattered inside the frame, reading loosely like morse -->
  <g fill="#FFFFFF" fill-opacity="0.16">
    <circle cx="870" cy="130" r="7"/>
    <circle cx="900" cy="130" r="15"/>
    <circle cx="945" cy="130" r="7"/>
    <circle cx="870" cy="190" r="15"/>
    <circle cx="910" cy="190" r="7"/>
    <circle cx="945" cy="190" r="7"/>
    <circle cx="985" cy="190" r="15"/>
    <circle cx="870" cy="250" r="7"/>
    <circle cx="905" cy="250" r="7"/>
    <circle cx="950" cy="250" r="15"/>
    <circle cx="990" cy="250" r="7"/>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="600" y="330" font-size="28" letter-spacing="7" fill="#FFFFFF" fill-opacity="0.5">ENOLA HOLMES 3 — VINE FX BREAKDOWN</text>

    <text x="600" y="440" font-size="86" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">READ THE
    </text>
    <text x="600" y="530" font-size="86" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">SMUDGES
    </text>

    <text x="600" y="590" font-size="30" fill="#FFFFFF" fill-opacity="0.55">
      150 SHOTS, ONE OF THEM A FINGERPRINT CODE
    </text>
  </g>

  <rect x="500" y="630" width="200" height="8" rx="4" fill="url(#accentEnola)"/>
</svg>
