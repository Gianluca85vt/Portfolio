<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="EA's new owners are targeting 700 million dollars in annual cost cuts">
  <defs>
    <linearGradient id="bgEA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#2A1140"/>
      <stop offset="100%" stop-color="#7621B0"/>
    </linearGradient>
    <linearGradient id="accentEA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#BE4C00"/>
      <stop offset="100%" stop-color="#B600A8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgEA)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2">
    <path d="M0 200H1200M0 350H1200M0 500H1200"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="150" font-size="30" letter-spacing="8" fill="#FFFFFF" fill-opacity="0.5" font-weight="bold">EA GOES PRIVATE, $55B DEAL</text>

    <text x="600" y="400" font-size="190" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">$700M</text>

    <text x="600" y="465" font-size="32" fill="#FFFFFF" fill-opacity="0.6" font-weight="bold">
      A YEAR IN COST CUTS, TOLD TO CREDITORS
    </text>
    <text x="600" y="505" font-size="26" fill="#FFFFFF" fill-opacity="0.45">
      nine days after the deal closed
    </text>
  </g>

  <rect x="500" y="550" width="200" height="8" rx="4" fill="url(#accentEA)"/>
</svg>
