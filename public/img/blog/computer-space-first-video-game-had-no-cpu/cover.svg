<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Computer Space, 1971 — the first arcade video game, built with no CPU">
  <defs>
    <linearGradient id="bgCS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#2A1140"/>
      <stop offset="100%" stop-color="#7621B0"/>
    </linearGradient>
    <linearGradient id="accentCS" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B600A8"/>
      <stop offset="100%" stop-color="#7621B0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgCS)"/>

  <!-- faint circuit grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2">
    <path d="M0 180H1200M0 320H1200M0 460H1200"/>
    <path d="M180 0V900M420 0V900M780 0V900M1020 0V900"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.12">
    <circle cx="180" cy="180" r="6"/>
    <circle cx="420" cy="320" r="6"/>
    <circle cx="780" cy="180" r="6"/>
    <circle cx="1020" cy="460" r="6"/>
    <circle cx="420" cy="460" r="6"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="150" font-size="28" letter-spacing="9" fill="#FFFFFF" fill-opacity="0.5" font-weight="bold">COMPUTER SPACE, 1971</text>

    <text x="600" y="360" font-size="170" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">NO CPU</text>

    <text x="600" y="440" font-size="46" fill="#FFFFFF" fill-opacity="0.6" font-weight="bold">
      NO ROM. NO FRAME BUFFER.
    </text>
    <text x="600" y="490" font-size="30" fill="#FFFFFF" fill-opacity="0.45">
      a rotating spaceship wired directly into transistor logic
    </text>
  </g>

  <rect x="500" y="530" width="200" height="8" rx="4" fill="url(#accentCS)"/>
</svg>
