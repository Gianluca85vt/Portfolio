<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Three ex-Epic teams building AI-native game engines">
  <defs>
    <linearGradient id="bgGames" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#5A1030"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
    <linearGradient id="accentGames" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D6294E"/>
      <stop offset="100%" stop-color="#B600A8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgGames)"/>

  <!-- three diverging branch nodes, one origin -->
  <g stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="4" fill="none">
    <path d="M600 220 L360 340"/>
    <path d="M600 220 L600 360"/>
    <path d="M600 220 L840 340"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="600" cy="220" r="10" fill-opacity="0.85"/>
    <circle cx="360" cy="340" r="8" fill-opacity="0.55"/>
    <circle cx="600" cy="360" r="8" fill-opacity="0.55"/>
    <circle cx="840" cy="340" r="8" fill-opacity="0.55"/>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="600" y="130" font-size="28" letter-spacing="8" fill="#FFFFFF" fill-opacity="0.5">EX-EPIC, THREE WAYS</text>

    <text x="600" y="470" font-size="88" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">AI-NATIVE</text>
    <text x="600" y="560" font-size="68" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">ENGINES</text>
  </g>

  <rect x="500" y="600" width="200" height="8" rx="4" fill="url(#accentGames)"/>

  <text x="600" y="660" text-anchor="middle" font-size="30" fill="#FFFFFF" fill-opacity="0.6"
        font-family="Arial, Helvetica, sans-serif">"10-15 people" — minus the pipeline</text>
</svg>
