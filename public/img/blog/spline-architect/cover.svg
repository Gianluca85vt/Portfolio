<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="A Unity spline tool now supports GPU instancing up to one million objects along a spline">
  <defs>
    <linearGradient id="bgSA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#401A10"/>
      <stop offset="100%" stop-color="#BE4C00"/>
    </linearGradient>
    <linearGradient id="accentSA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#BE4C00"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgSA)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" fill="none">
    <path d="M60 260 C 300 180, 420 340, 660 260 S 1020 200, 1140 300"/>
    <path d="M60 320 C 300 240, 420 400, 660 320 S 1020 260, 1140 360"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.18">
    <circle cx="120" cy="272" r="5"/>
    <circle cx="260" cy="212" r="5"/>
    <circle cx="400" cy="300" r="5"/>
    <circle cx="540" cy="340" r="5"/>
    <circle cx="680" cy="262" r="5"/>
    <circle cx="820" cy="210" r="5"/>
    <circle cx="960" cy="232" r="5"/>
    <circle cx="1100" cy="300" r="5"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="150" font-size="28" letter-spacing="7" fill="#FFFFFF" fill-opacity="0.5" font-weight="bold">SPLINE ARCHITECT, GPU INSTANCING</text>

    <text x="600" y="470" font-size="150" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">1,000,000</text>

    <text x="600" y="525" font-size="30" fill="#FFFFFF" fill-opacity="0.65" font-weight="bold">
      OBJECTS ALONG A SINGLE SPLINE
    </text>
    <text x="600" y="562" font-size="24" fill="#FFFFFF" fill-opacity="0.45">
      up from the 100,000-instance version, per 80.lv
    </text>
  </g>

  <rect x="500" y="605" width="200" height="8" rx="4" fill="url(#accentSA)"/>
</svg>
