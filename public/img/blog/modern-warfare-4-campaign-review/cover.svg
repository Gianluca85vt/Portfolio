<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Modern Warfare 4's campaign scores 8.5, from five verdicts between 7 and 9">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#g)"/>
  <text x="80" y="140" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#ffffff" opacity="0.72" letter-spacing="3">MODERN WARFARE 4 — CAMPAIGN</text>
  <text x="80" y="350" font-family="Helvetica, Arial, sans-serif" font-size="215" font-weight="700" fill="#ffffff">8.5</text>
  <text x="80" y="430" font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#ffffff" opacity="0.9">from five verdicts, 7 to 9</text>
  <text x="80" y="500" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#ffffff" opacity="0.66">sixteen missions, six to nine hours</text>
  <text x="80" y="556" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#ffffff" opacity="0.66">no PS4 floor for the first time</text>
</svg>
