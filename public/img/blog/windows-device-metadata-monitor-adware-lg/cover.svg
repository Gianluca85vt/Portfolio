<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Zero permission prompts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#3A1350"/>
      <stop offset="100%" stop-color="#7621B0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7621B0"/>
      <stop offset="100%" stop-color="#B600A8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2">
    <path d="M0 150H1200M0 300H1200M0 450H1200M0 600H1200"/>
    <path d="M150 0V900M300 0V900M450 0V900M600 0V900M750 0V900M900 0V900M1050 0V900"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="170" font-size="30" letter-spacing="8" fill="#FFFFFF" fill-opacity="0.5"
          font-weight="bold">WINDOWS DEVICE METADATA</text>

    <text x="600" y="400" font-size="220" font-weight="900" fill="#FFFFFF">0</text>

    <text x="600" y="470" font-size="34" fill="#FFFFFF" fill-opacity="0.55" font-weight="bold"
          letter-spacing="2">
      PERMISSION PROMPTS TO INSTALL SOFTWARE
    </text>

    <text x="600" y="520" font-size="26" fill="#FFFFFF" fill-opacity="0.4">
      via a monitor's driver update, through Windows Update
    </text>
  </g>

  <rect x="500" y="560" width="200" height="8" rx="4" fill="url(#accent)"/>
</svg>
