<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="GTA 6 review: seven perfect verdicts, locked at 30fps">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18011F"/>
      <stop offset="1" stop-color="#D6294E"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <text x="90" y="150" font-family="Helvetica, Arial, sans-serif" font-size="34" letter-spacing="7" fill="#FFFFFF" fill-opacity="0.72">GRAND THEFT AUTO 6</text>
  <text x="90" y="330" font-family="Helvetica, Arial, sans-serif" font-size="190" font-weight="700" fill="#FFFFFF">7 verdicts.</text>
  <text x="90" y="470" font-family="Helvetica, Arial, sans-serif" font-size="190" font-weight="700" fill="#FFFFFF">Zero spread.</text>
  <text x="90" y="570" font-family="Helvetica, Arial, sans-serif" font-size="46" fill="#FFFFFF" fill-opacity="0.85">Locked at 30fps on PS5 and PS5 Pro</text>
  <rect x="90" y="620" width="300" height="5" fill="#FFFFFF" fill-opacity="0.5"/>
</svg>
