<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Same mesh, different lighting: the Tides of Annihilation face debate">
  <defs>
    <linearGradient id="bgFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#4A0E20"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
    <linearGradient id="accentFace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D6294E"/>
      <stop offset="100%" stop-color="#B600A8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgFace)"/>

  <!-- two face silhouettes, same outline, different shading -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3">
    <ellipse cx="330" cy="430" rx="150" ry="190"/>
    <ellipse cx="870" cy="430" rx="150" ry="190"/>
  </g>
  <g fill="#FFFFFF">
    <ellipse cx="330" cy="430" rx="150" ry="190" fill-opacity="0.06"/>
    <ellipse cx="870" cy="430" rx="150" ry="190" fill-opacity="0.16"/>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="600" y="140" font-size="30" letter-spacing="8" fill="#FFFFFF" fill-opacity="0.5">TIDES OF ANNIHILATION</text>

    <text x="600" y="250" font-size="70" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">SAME MESH</text>
    <text x="600" y="740" font-size="70" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">DIFFERENT LIGHT</text>

    <text x="330" y="650" font-size="26" fill="#FFFFFF" fill-opacity="0.55">EARLIER TRAILER</text>
    <text x="870" y="650" font-size="26" fill="#FFFFFF" fill-opacity="0.55">RECENT FOOTAGE</text>
  </g>

  <rect x="500" y="790" width="200" height="8" rx="4" fill="url(#accentFace)"/>
</svg>
