  <text x="80" y="672" fill="#D7E2EA" fill-opacity="0.5" font-family="Arial, sans-serif" font-size="22" letter-spacing="4">YOUTUBE, SIX HOURS LATER</text>
  <text x="80" y="734" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="bold" font-size="48">9PM ET · 2AM BST · 3AM CEST</text>

  <text x="80" y="820" fill="#D7E2EA" fill-opacity="0.42" font-family="Arial, sans-serif" font-size="26">~30 minutes · captured in-game on PS5 · 27 August 2026</text>
