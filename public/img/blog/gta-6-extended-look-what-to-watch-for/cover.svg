<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="GTA VI An Extended Look — Netflix 3pm ET, YouTube six hours later">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="52%" stop-color="#3A0B33"/>
      <stop offset="100%" stop-color="#BE4C00"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>

  <text x="80" y="130" fill="#D7E2EA" fill-opacity="0.55" font-family="Arial, sans-serif" font-size="26" letter-spacing="6">GRAND THEFT AUTO VI</text>

  <text x="80" y="270" fill="#FFFFFF" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="118" letter-spacing="-3">AN EXTENDED</text>
  <text x="80" y="390" fill="#FFFFFF" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="118" letter-spacing="-3">LOOK</text>

