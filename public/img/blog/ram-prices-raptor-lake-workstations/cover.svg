<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="32GB DDR5 kit price, mid-2025 to 2026">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#3A1758"/>
      <stop offset="100%" stop-color="#7621B0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B600A8"/>
      <stop offset="100%" stop-color="#7621B0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- faint grid, like a memory die -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2">
    <path d="M0 150H1200M0 300H1200M0 450H1200M0 600H1200"/>
    <path d="M150 0V900M300 0V900M450 0V900M600 0V900M750 0V900M900 0V900M1050 0V900"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="150" font-size="30" letter-spacing="8" fill="#FFFFFF" fill-opacity="0.5"
          font-weight="bold">32GB DDR5 KIT</text>

    <text x="600" y="360" font-size="180" font-weight="900" fill="#FFFFFF">$95 &#8594; $550</text>

    <text x="600" y="430" font-size="34" fill="#FFFFFF" fill-opacity="0.45" font-weight="bold">
      MID-2025 TO 2026, ROUGHLY 480% UP
    </text>
  </g>

  <rect x="500" y="480" width="200" height="8" rx="4" fill="url(#accent)"/>
</svg>
