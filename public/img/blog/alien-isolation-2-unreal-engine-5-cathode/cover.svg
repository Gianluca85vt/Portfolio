<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Alien: Isolation 2 moves from the Cathode engine to Unreal Engine 5">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#4A2000"/>
      <stop offset="100%" stop-color="#BE4C00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <g stroke="#FFD79A" stroke-opacity="0.07" stroke-width="2">
    <path d="M0 120H1200M0 220H1200M0 320H1200M0 420H1200M0 520H1200M0 620H1200"/>
  </g>

  <g fill="#FFD79A" font-family="Helvetica, Arial, sans-serif">
