    <text x="80" y="330" font-size="150" font-weight="700">CATHODE</text>
    <text x="80" y="470" font-size="150" font-weight="700" fill="#FFFFFF">UNREAL 5</text>
    <text x="80" y="560" font-size="40" fill-opacity="0.85">A 1979 look, rebuilt outdoors</text>
  </g>

  <g stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="6" fill="none">
    <path d="M700 380h150l-28-28M850 380l-28 28"/>
  </g>

  <rect x="80" y="690" width="210" height="6" fill="#FFD79A" fill-opacity="0.6"/>
