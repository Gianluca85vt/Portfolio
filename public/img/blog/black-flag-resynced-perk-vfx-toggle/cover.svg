<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Black Flag Resynced update 1.0.7 adds a Perk Effects toggle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#3A0F1E"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFD9A0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFD9A0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <circle cx="600" cy="300" r="260" fill="url(#aura)"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="132" font-size="26" letter-spacing="7" fill="#FFFFFF" fill-opacity="0.55"
          font-weight="bold">BLACK FLAG RESYNCED</text>

    <text x="600" y="290" font-size="150" font-weight="900" fill="#FFFFFF">1.0.7</text>
    <text x="600" y="368" font-size="52" font-weight="900" fill="#FFFFFF" fill-opacity="0.94">PERK EFFECTS: OFF</text>

    <text x="600" y="432" font-size="27" fill="#FFFFFF" fill-opacity="0.55" font-weight="bold">
      THE AURA THAT IGNORED YOUR LIGHTING
    </text>
  </g>

  <rect x="500" y="482" width="200" height="8" rx="4" fill="#D6294E"/>
</svg>
