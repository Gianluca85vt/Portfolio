<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Halo's co-creator says Campaign Evolved's ring looks damn ugly and out of scale">
  <defs>
    <linearGradient id="bgHalo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#5A0E22"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
    <linearGradient id="accentHalo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D6294E"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgHalo)"/>

  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3">
    <circle cx="600" cy="230" r="330"/>
    <circle cx="600" cy="230" r="300"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.1">
    <circle cx="600" cy="230" r="70"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="140" font-size="24" letter-spacing="6" fill="#FFFFFF" fill-opacity="0.55" font-weight="bold">HALO: CAMPAIGN EVOLVED</text>

    <text x="600" y="480" font-size="92" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">"DAMN UGLY,</text>
    <text x="600" y="560" font-size="92" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">OUT OF SCALE"</text>

    <text x="600" y="612" font-size="28" fill="#FFFFFF" fill-opacity="0.65" font-weight="bold">
      HALO CO-CREATOR MARCUS LEHTO ON THE NEW RING
    </text>
  </g>

  <rect x="500" y="650" width="200" height="8" rx="4" fill="url(#accentHalo)"/>
</svg>
