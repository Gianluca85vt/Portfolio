<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Widow's Bay, Best Set Decoration">
  <defs>
    <linearGradient id="bgWidow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#28134A"/>
      <stop offset="100%" stop-color="#5B3FBF"/>
    </linearGradient>
    <linearGradient id="accentWidow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B3FBF"/>
      <stop offset="100%" stop-color="#B600A8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgWidow)"/>

  <!-- faint fog bands -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="3">
    <path d="M0 560H1200M0 600H1200M0 640H1200"/>
  </g>

  <!-- lighthouse silhouette, right side -->
  <g fill="#0B000F" fill-opacity="0.55">
    <rect x="1000" y="330" width="46" height="260" />
    <path d="M986 330 L1060 330 L1046 300 L1000 300 Z"/>
    <rect x="994" y="270" width="58" height="34"/>
    <rect x="1010" y="240" width="26" height="34"/>
    <rect x="960" y="588" width="140" height="14"/>
  </g>
  <circle cx="1023" cy="285" r="7" fill="#FFD9A0" fill-opacity="0.65"/>

  <!-- distant town roofline, low horizon -->
  <g fill="#0B000F" fill-opacity="0.45">
    <path d="M60 600 L60 560 L110 560 L110 540 L150 540 L150 570 L210 570 L210 545 L260 545 L260 600 Z"/>
    <path d="M280 600 L280 570 L330 570 L330 550 L380 550 L380 600 Z"/>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="600" y="300" font-size="26" letter-spacing="9" fill="#FFFFFF" fill-opacity="0.5">SET DECORATORS SOCIETY OF AMERICA</text>

    <text x="600" y="450" font-size="100" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">WIDOW'S BAY</text>

    <text x="600" y="520" font-size="32" fill="#FFFFFF" fill-opacity="0.55">
      BEST SET DECORATION, 2026
    </text>
  </g>

  <rect x="500" y="560" width="200" height="8" rx="4" fill="url(#accentWidow)"/>
</svg>
