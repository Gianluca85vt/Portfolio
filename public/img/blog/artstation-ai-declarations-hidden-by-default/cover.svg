<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="ArtStation AI declarations: three options on the publish form, hidden by default">
  <defs>
    <linearGradient id="bgAS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="58%" stop-color="#4A2000"/>
      <stop offset="100%" stop-color="#BE4C00"/>
    </linearGradient>
    <linearGradient id="accAS" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD79A"/>
      <stop offset="100%" stop-color="#BE4C00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgAS)"/>

  <!-- the three declaration options, the middle one selected -->
  <g transform="translate(96,118)">
    <text x="0" y="0" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="600" fill="#FFD79A" fill-opacity="0.72" letter-spacing="5">DECLARE GENERATIVE AI USE</text>

    <g font-family="Helvetica,Arial,sans-serif" font-size="40" fill="#FFF4E4">
      <circle cx="22" cy="80" r="18" fill="none" stroke="#FFD79A" stroke-opacity="0.5" stroke-width="3"/>
      <text x="66" y="94" fill-opacity="0.56">Primarily generative AI</text>

      <circle cx="22" cy="166" r="18" fill="none" stroke="#FFD79A" stroke-width="4"/>
      <circle cx="22" cy="166" r="8" fill="#FFD79A"/>
      <text x="66" y="180" font-weight="700">Mixed</text>

      <circle cx="22" cy="252" r="18" fill="none" stroke="#FFD79A" stroke-opacity="0.5" stroke-width="3"/>
      <text x="66" y="266" fill-opacity="0.56">100% non-generative</text>
    </g>

    <text x="0" y="392" font-family="Helvetica,Arial,sans-serif" font-size="128" font-weight="700" fill="url(#accAS)">3 buttons.</text>
    <text x="0" y="516" font-family="Helvetica,Arial,sans-serif" font-size="128" font-weight="700" fill="#FFF4E4">40 pipeline steps.</text>
  </g>

  <!-- the viewer-side filter, faint, lower third -->
  <g transform="translate(96,742)" font-family="Helvetica,Arial,sans-serif">
    <rect x="0" y="-34" width="560" height="4" fill="#FFD79A" fill-opacity="0.26"/>
    <text x="0" y="22" font-size="34" fill="#FFF4E4" fill-opacity="0.78">Browse filter: declared AI hidden by default</text>
    <text x="0" y="74" font-size="30" fill="#FFD79A" fill-opacity="0.6">Suspected AI: strict &#183; reports from viewers</text>
  </g>
</svg>
