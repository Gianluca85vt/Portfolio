<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" width="1440" height="810" role="img" aria-label="Diagram of ground-wear continuity: a relocated structure leaves worn ground behind">
  <defs>
    <linearGradient id="skyGW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A0B22"/>
      <stop offset="100%" stop-color="#3A1E44"/>
    </linearGradient>
    <linearGradient id="groundGW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A4A34"/>
      <stop offset="100%" stop-color="#4A2A1E"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="810" fill="url(#skyGW)"/>
  <rect y="460" width="1440" height="350" fill="url(#groundGW)"/>

  <!-- raw, less-worn soil texture (right side) -->
  <g fill="#8C5B3F" opacity="0.5">
    <circle cx="1020" cy="560" r="4"/>
    <circle cx="1080" cy="600" r="3"/>
    <circle cx="1140" cy="540" r="5"/>
    <circle cx="1200" cy="620" r="3"/>
    <circle cx="1260" cy="570" r="4"/>
    <circle cx="1050" cy="680" r="4"/>
    <circle cx="1150" cy="700" r="3"/>
    <circle cx="1280" cy="660" r="5"/>
    <circle cx="960" cy="640" r="3"/>
  </g>

  <!-- worn, compacted ground where a structure once stood (left-center) -->
  <ellipse cx="520" cy="640" rx="260" ry="60" fill="#3A2418" opacity="0.85"/>
  <ellipse cx="520" cy="640" rx="260" ry="60" fill="none" stroke="#F2C879" stroke-width="2" stroke-dasharray="6 8" opacity="0.6"/>

  <!-- ghost outline of the original structure footprint -->
  <rect x="410" y="590" width="220" height="14" fill="#F2C879" opacity="0.35"/>

  <!-- relocated structure, now standing elsewhere on raw ground -->
  <g fill="#1A0F14">
    <rect x="1080" y="470" width="90" height="130"/>
    <rect x="1105" y="440" width="40" height="30"/>
    <circle cx="1125" cy="425" r="14"/>
  </g>

  <!-- shadow under relocated structure, raw ground beneath -->
  <ellipse cx="1125" cy="605" rx="70" ry="14" fill="#000000" opacity="0.3"/>

  <!-- labels -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="520" y="740" text-anchor="middle" font-size="26" font-weight="bold" fill="#F2C879">COMPACTED GROUND</text>
    <text x="520" y="770" text-anchor="middle" font-size="19" fill="#F2C879" opacity="0.75">years of foot traffic, still visible after the move</text>

    <text x="1125" y="670" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">STRUCTURE, RELOCATED</text>
    <text x="1125" y="700" text-anchor="middle" font-size="19" fill="#FFFFFF" opacity="0.7">now standing on rawer, less-trafficked soil</text>
  </g>

  <!-- arrow showing the move -->
  <path d="M 700,560 C 850,480 950,460 1060,480" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3" stroke-dasharray="10 8"/>
  <path d="M 1060,480 L 1040,470 L 1050,495 Z" fill="#FFFFFF" fill-opacity="0.4"/>
</svg>
