<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="For All Mankind season 5, DNEG VFX breakdown">
  <defs>
    <linearGradient id="bgFAM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#3A1440"/>
      <stop offset="100%" stop-color="#5B3FBF"/>
    </linearGradient>
    <linearGradient id="accentFAM" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B3FBF"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
    <radialGradient id="sunFAM" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFB37A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFB37A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgFAM)"/>

  <g fill="#FFFFFF">
    <circle cx="100" cy="110" r="2" opacity="0.6"/>
    <circle cx="190" cy="70" r="1.5" opacity="0.5"/>
    <circle cx="1090" cy="100" r="2" opacity="0.6"/>
    <circle cx="1010" cy="190" r="1.5" opacity="0.4"/>
    <circle cx="150" cy="240" r="1.5" opacity="0.4"/>
  </g>

  <circle cx="960" cy="150" r="150" fill="url(#sunFAM)"/>

  <!-- Mars horizon -->
  <path d="M0,560 Q 220,505 430,540 T 830,530 Q 1000,510 1200,555 L1200,900 L0,900 Z" fill="#241030" opacity="0.9"/>
  <path d="M0,600 Q 260,560 520,590 T 950,575 Q 1090,560 1200,595 L1200,900 L0,900 Z" fill="#150a1e"/>

  <!-- colony structures, low silhouettes -->
  <g fill="#0B000F" fill-opacity="0.85">
    <rect x="260" y="565" width="18" height="34"/>
    <rect x="286" y="550" width="14" height="49"/>
    <rect x="308" y="572" width="22" height="27"/>
    <circle cx="360" cy="580" r="19"/>
    <rect x="640" y="558" width="16" height="41"/>
    <rect x="664" y="570" width="24" height="29"/>
    <circle cx="720" cy="576" r="23"/>
    <rect x="760" y="562" width="14" height="37"/>
  </g>

  <!-- worn ground patch, the article's central image -->
  <ellipse cx="500" cy="640" rx="90" ry="20" fill="#3A2418" fill-opacity="0.55"/>
  <ellipse cx="500" cy="640" rx="90" ry="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="4 6"/>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="600" y="190" font-size="22" letter-spacing="6" fill="#FFFFFF" fill-opacity="0.55">FOR ALL MANKIND — SEASON 5</text>

    <text x="600" y="290" font-size="72" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">AGING MARS</text>
    <text x="600" y="345" font-size="30" fill="#FFFFFF" fill-opacity="0.75">338 SHOTS · DNEG</text>

    <text x="600" y="400" font-size="24" fill="#FFFFFF" fill-opacity="0.55">
      THE GROUND REMEMBERS WHAT USED TO STAND THERE
    </text>
  </g>

  <rect x="500" y="435" width="200" height="8" rx="4" fill="url(#accentFAM)"/>
</svg>
