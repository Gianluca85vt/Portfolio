<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Night City at twice The Witcher 3's texel density">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#1E2547"/>
      <stop offset="100%" stop-color="#2E6BA8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5FA8FF"/>
      <stop offset="100%" stop-color="#A6D8FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <g opacity="0.16" fill="#A6D8FF">
    <rect x="70" y="520" width="58" height="380"/>
    <rect x="148" y="430" width="44" height="470"/>
    <rect x="212" y="580" width="72" height="320"/>
    <rect x="304" y="360" width="50" height="540"/>
    <rect x="374" y="620" width="38" height="280"/>
    <rect x="432" y="470" width="66" height="430"/>
    <rect x="770" y="600" width="52" height="300"/>
    <rect x="842" y="500" width="40" height="400"/>
    <rect x="902" y="660" width="70" height="240"/>
    <rect x="992" y="440" width="48" height="460"/>
    <rect x="1060" y="620" width="60" height="280"/>
  </g>
  <text x="80" y="150" font-family="Helvetica, Arial, sans-serif" font-size="34" letter-spacing="7" fill="#7FBFFF">NIGHT CITY, BY HAND</text>
  <text x="80" y="360" font-family="Helvetica, Arial, sans-serif" font-size="230" font-weight="700" fill="url(#accent)">2&#215;</text>
  <text x="80" y="450" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="600" fill="#F2F6FF">the texel density of</text>
  <text x="80" y="522" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="600" fill="#F2F6FF">The Witcher 3</text>
  <rect x="80" y="566" width="150" height="5" fill="#5FA8FF"/>
  <text x="80" y="640" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#B9CBE8">Every building, advert and bin placed by an artist</text>
</svg>
