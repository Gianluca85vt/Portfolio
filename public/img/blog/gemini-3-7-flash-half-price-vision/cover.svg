<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Gemini 3.7 Flash: half price, one million token context">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#4A0F52"/>
      <stop offset="100%" stop-color="#B600A8"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7621B0"/>
      <stop offset="100%" stop-color="#B600A8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg3)"/>

  <!-- a grid of frames: video/image input, the thing that got cheap -->
  <g stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3" fill="none">
    <rect x="90" y="90" width="120" height="80"/><rect x="230" y="90" width="120" height="80"/>
    <rect x="370" y="90" width="120" height="80"/><rect x="510" y="90" width="120" height="80"/>
    <rect x="650" y="90" width="120" height="80"/><rect x="790" y="90" width="120" height="80"/>
    <rect x="930" y="90" width="120" height="80"/><rect x="1070" y="90" width="70" height="80"/>
    <rect x="90" y="190" width="120" height="80"/><rect x="230" y="190" width="120" height="80"/>
    <rect x="370" y="190" width="120" height="80"/><rect x="510" y="190" width="120" height="80"/>
    <rect x="650" y="190" width="120" height="80"/><rect x="790" y="190" width="120" height="80"/>
    <rect x="930" y="190" width="120" height="80"/><rect x="1070" y="190" width="70" height="80"/>
  </g>

  <g text-anchor="middle">
    <text x="600" y="180" font-size="30" letter-spacing="9" fill="#FFFFFF" fill-opacity="0.55"
          font-family="Arial, Helvetica, sans-serif" font-weight="bold">GEMINI 3.7 FLASH</text>

    <text x="600" y="410" font-size="230" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">-50%</text>

    <text x="600" y="480" font-size="30" letter-spacing="3" fill="#FFFFFF" fill-opacity="0.55"
          font-family="Arial, Helvetica, sans-serif" font-weight="bold">1M TOKENS · VISION + VIDEO · $0.75/M IN</text>
  </g>

  <rect x="500" y="530" width="200" height="8" rx="4" fill="url(#accent3)"/>
</svg>
