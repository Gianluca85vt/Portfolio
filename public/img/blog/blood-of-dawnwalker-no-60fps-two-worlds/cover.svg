<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="The Blood of Dawnwalker has no 60fps mode, day or night">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#5A1030"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
    <linearGradient id="accentD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D6294E"/>
      <stop offset="100%" stop-color="#3f4fc9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgD)"/>

  <!-- split day/night backdrop -->
  <rect x="0" y="0" width="600" height="900" fill="#c96a3f" opacity="0.12"/>
  <rect x="600" y="0" width="600" height="900" fill="#3f4fc9" opacity="0.16"/>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="600" y="140" font-size="28" letter-spacing="7" fill="#FFFFFF" fill-opacity="0.55">THE BLOOD OF DAWNWALKER</text>

    <text x="600" y="330" font-size="128" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">NO 60FPS</text>

    <text x="600" y="400" font-size="40" font-weight="900" fill="#FFFFFF" fill-opacity="0.92"
          font-family="Arial Black, Arial, Helvetica, sans-serif">ON PS5, PRO OR SERIES X</text>

    <text x="330" y="460" font-size="24" letter-spacing="2" fill="#FFFFFF" fill-opacity="0.65">30FPS QUALITY — DAY</text>
    <text x="870" y="460" font-size="24" letter-spacing="2" fill="#FFFFFF" fill-opacity="0.65">40FPS BALANCED — NIGHT</text>
  </g>

  <rect x="500" y="500" width="200" height="8" rx="4" fill="url(#accentD)"/>
</svg>
