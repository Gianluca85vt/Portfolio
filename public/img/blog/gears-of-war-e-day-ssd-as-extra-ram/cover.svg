<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Gears of War E-Day streams up to 3.7 gigabytes per second off the SSD to save system RAM">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18011F"/>
      <stop offset="1" stop-color="#1D4E63"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#g)"/>
  <text x="80" y="150" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#7FD6E8" letter-spacing="6">GEARS OF WAR: E-DAY</text>
  <text x="80" y="340" font-family="Helvetica, Arial, sans-serif" font-size="190" font-weight="700" fill="#FFFFFF">3.7 GB/s</text>
  <text x="80" y="420" font-family="Helvetica, Arial, sans-serif" font-size="46" fill="#E6F4F8">streamed off the SSD,</text>
  <text x="80" y="485" font-family="Helvetica, Arial, sans-serif" font-size="46" fill="#E6F4F8">to save system RAM</text>
  <rect x="80" y="540" width="640" height="3" fill="#7FD6E8" opacity="0.55"/>
  <text x="80" y="610" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#9FBFCB">Series S: 10GB of GDDR6, and a flash tier.</text>
</svg>
