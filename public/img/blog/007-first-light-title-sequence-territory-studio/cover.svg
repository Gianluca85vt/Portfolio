<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Territory Studio's title sequence for 007 First Light">
  <defs>
    <linearGradient id="bg007" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#4A2000"/>
      <stop offset="100%" stop-color="#BE4C00"/>
    </linearGradient>
    <linearGradient id="accent007" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#BE4C00"/>
      <stop offset="100%" stop-color="#FFD79A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg007)"/>

  <!-- faceted refractive glass shards, faint -->
  <g stroke="#FFD79A" stroke-opacity="0.16" stroke-width="2" fill="none">
    <polygon points="100,520 220,470 260,600 130,650"/>
    <polygon points="260,600 380,540 420,660 300,700"/>
    <polygon points="900,500 1010,450 1050,580 930,630"/>
    <polygon points="1030,600 1140,560 1170,690 1050,720"/>
  </g>
  <g stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5">
    <line x1="100" y1="520" x2="380" y2="540"/>
    <line x1="900" y1="500" x2="1170" y2="690"/>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="600" y="150" font-size="28" letter-spacing="8" fill="#FFFFFF" fill-opacity="0.45">TERRITORY STUDIO</text>

    <text x="600" y="290" font-size="72" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">BORROWED</text>
    <text x="600" y="390" font-size="72" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">PERFORMANCE</text>

    <text x="600" y="470" font-size="38" fill="#FFFFFF" fill-opacity="0.6">007 FIRST LIGHT'S TITLE SEQUENCE</text>
  </g>

  <rect x="500" y="520" width="200" height="8" rx="4" fill="url(#accent007)"/>
</svg>
