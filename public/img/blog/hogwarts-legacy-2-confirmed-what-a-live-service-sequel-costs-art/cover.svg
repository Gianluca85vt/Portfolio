<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Hogwarts Legacy 2 confirmed, and the live-service question underneath it">
  <defs>
    <linearGradient id="bgHL2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#4A0F22"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
    <linearGradient id="accentHL2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D6294E"/>
      <stop offset="100%" stop-color="#FF9EB2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgHL2)"/>

  <!-- modular kit grid: identical tiles, some duplicated to suggest reuse-at-scale -->
  <g stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3" fill="none">
    <rect x="90" y="540" width="100" height="100"/>
    <rect x="200" y="540" width="100" height="100"/>
    <rect x="90" y="650" width="100" height="100"/>
    <rect x="200" y="650" width="100" height="100"/>
    <rect x="900" y="540" width="100" height="100"/>
    <rect x="1010" y="540" width="100" height="100"/>
    <rect x="900" y="650" width="100" height="100"/>
    <rect x="1010" y="650" width="100" height="100"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.16">
    <circle cx="140" cy="590" r="5"/><circle cx="250" cy="590" r="5"/>
    <circle cx="140" cy="700" r="5"/><circle cx="250" cy="700" r="5"/>
    <circle cx="950" cy="590" r="5"/><circle cx="1060" cy="590" r="5"/>
    <circle cx="950" cy="700" r="5"/><circle cx="1060" cy="700" r="5"/>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="600" y="140" font-size="26" letter-spacing="8" fill="#FFFFFF" fill-opacity="0.45">SHAREHOLDER LETTER, NOT A TRAILER</text>

    <text x="600" y="275" font-size="66" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">HOGWARTS</text>
    <text x="600" y="365" font-size="66" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">LEGACY 2</text>

    <text x="600" y="440" font-size="34" fill="#FFFFFF" fill-opacity="0.65">CONFIRMED. BUILT FOR LIVE OPS?</text>
  </g>

  <rect x="500" y="475" width="200" height="8" rx="4" fill="url(#accentHL2)"/>
</svg>
