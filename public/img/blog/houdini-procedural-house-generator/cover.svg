<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="One procedural generator standing in for hundreds of hand-modeled buildings">
  <defs>
    <linearGradient id="bgHG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#401A10"/>
      <stop offset="100%" stop-color="#BE4C00"/>
    </linearGradient>
    <linearGradient id="accentHG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#BE4C00"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgHG)"/>

  <g fill="#FFFFFF" fill-opacity="0.10">
    <rect x="90" y="330" width="80" height="130"/>
    <polygon points="90,330 130,290 170,330"/>
    <rect x="190" y="300" width="70" height="160"/>
    <polygon points="190,300 225,255 260,300"/>
    <rect x="280" y="345" width="90" height="115"/>
    <polygon points="280,345 325,300 370,345"/>
    <rect x="900" y="315" width="75" height="145"/>
    <polygon points="900,315 937,270 975,315"/>
    <rect x="990" y="335" width="85" height="125"/>
    <polygon points="990,335 1032,295 1075,335"/>
    <rect x="1080" y="300" width="70" height="160"/>
    <polygon points="1080,300 1115,255 1150,300"/>
  </g>

  <g stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5" fill="none">
    <line x1="130" y1="290" x2="130" y2="460"/>
    <line x1="225" y1="255" x2="225" y2="460"/>
    <line x1="325" y1="300" x2="325" y2="460"/>
    <line x1="937" y1="270" x2="937" y2="460"/>
    <line x1="1032" y1="295" x2="1032" y2="460"/>
    <line x1="1115" y1="255" x2="1115" y2="460"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="150" font-size="26" letter-spacing="6" fill="#FFFFFF" fill-opacity="0.5" font-weight="bold">HOUDINI, PROCEDURAL WORKFLOW</text>

    <text x="600" y="440" font-size="118" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">1 GENERATOR</text>

    <text x="600" y="500" font-size="30" fill="#FFFFFF" fill-opacity="0.65" font-weight="bold">
      STANDS IN FOR HUNDREDS OF BUILDINGS
    </text>
    <text x="600" y="537" font-size="24" fill="#FFFFFF" fill-opacity="0.45">
      Ezequiel Grand's procedural house tool, via 80.lv
    </text>
  </g>

  <rect x="500" y="580" width="200" height="8" rx="4" fill="url(#accentHG)"/>
</svg>
