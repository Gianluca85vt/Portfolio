<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="210GB on PS5">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="60%" stop-color="#6B1327"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- stacked bars: the install, the package, the headroom -->
  <g fill="#FFFFFF">
    <rect x="96" y="120" width="880" height="34" fill-opacity="0.85"/>
    <rect x="96" y="176" width="608" height="34" fill-opacity="0.42"/>
    <rect x="96" y="232" width="296" height="34" fill-opacity="0.20"/>
  </g>

  <text x="96" y="400" font-family="Helvetica, Arial, sans-serif" font-size="196" font-weight="700" fill="#FFFFFF">210GB</text>
  <text x="96" y="470" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="400" fill="#FFFFFF" fill-opacity="0.82">GTA 6 on PS5, reported</text>

  <text x="96" y="580" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#FFFFFF" fill-opacity="0.66">Phantom Blade Zero: 145GB installed,</text>
  <text x="96" y="632" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#FFFFFF" fill-opacity="0.66">300GB free to get there</text>
</svg>
