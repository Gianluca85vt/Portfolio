<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Two separate claims: a disputed labor story about whether a writer was replaced, and a confirmed technical detail about generative dialogue for an infinite-passenger mode">
  <defs>
    <linearGradient id="bgDiagram" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="100%" stop-color="#2A0A18"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bgDiagram)"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="60" font-size="28" fill="#FFFFFF" fill-opacity="0.7" font-weight="bold">ONE HEADLINE, TWO DIFFERENT CLAIMS</text>
  </g>

  <!-- Left card: labor dispute -->
  <rect x="60" y="110" width="510" height="520" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#D6294E" stroke-opacity="0.6" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="315" y="165" font-size="22" letter-spacing="3" fill="#D6294E" font-weight="bold">DISPUTED</text>
    <text x="315" y="215" font-size="34" fill="#FFFFFF" font-weight="900">Was a writer let go</text>
    <text x="315" y="255" font-size="34" fill="#FFFFFF" font-weight="900">because of AI?</text>

    <text x="315" y="320" font-size="20" fill="#FFFFFF" fill-opacity="0.75">Writer: replaced mid-development</text>
    <text x="315" y="352" font-size="20" fill="#FFFFFF" fill-opacity="0.75">CEO: let go, then a public feud</text>
    <text x="315" y="384" font-size="20" fill="#FFFFFF" fill-opacity="0.75">No paper trail published by either side</text>

    <text x="315" y="460" font-size="22" fill="#FFFFFF" fill-opacity="0.9" font-weight="bold">Two accounts.</text>
    <text x="315" y="495" font-size="22" fill="#FFFFFF" fill-opacity="0.9" font-weight="bold">Zero independent evidence yet.</text>
  </g>

  <!-- Right card: technical detail -->
  <rect x="630" y="110" width="510" height="520" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#7621B0" stroke-opacity="0.6" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="885" y="165" font-size="22" letter-spacing="3" fill="#7621B0" font-weight="bold">CONFIRMED</text>
    <text x="885" y="215" font-size="34" fill="#FFFFFF" font-weight="900">AI generates barks for</text>
    <text x="885" y="255" font-size="34" fill="#FFFFFF" font-weight="900">"infinite" passengers</text>

    <text x="885" y="320" font-size="20" fill="#FFFFFF" fill-opacity="0.75">One experimental, opt-in mode</text>
    <text x="885" y="352" font-size="20" fill="#FFFFFF" fill-opacity="0.75">Main story: written by people, per Saber</text>
    <text x="885" y="384" font-size="20" fill="#FFFFFF" fill-opacity="0.75">Same job scatter tools do for foliage</text>

    <text x="885" y="460" font-size="22" fill="#FFFFFF" fill-opacity="0.9" font-weight="bold">Scale problem.</text>
    <text x="885" y="495" font-size="22" fill="#FFFFFF" fill-opacity="0.9" font-weight="bold">Not a story about one job.</text>
  </g>
</svg>
