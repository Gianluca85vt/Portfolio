<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Saber Interactive CEO says he would have replaced his writer with AI">
  <defs>
    <linearGradient id="bgSaber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#3A0F22"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
    <linearGradient id="accentSaber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D6294E"/>
      <stop offset="100%" stop-color="#B600A8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgSaber)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2">
    <path d="M0 190H1200M0 330H1200M0 470H1200"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="130" font-size="26" letter-spacing="6" fill="#FFFFFF" fill-opacity="0.5" font-weight="bold">SABER INTERACTIVE, "RIDESHARE STIMULATOR"</text>

    <text x="600" y="300" font-size="72" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">"I'd HAVE BEEN</text>
    <text x="600" y="380" font-size="72" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">HAPPY TO</text>
    <text x="600" y="460" font-size="72" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">REPLACE HER"</text>

    <text x="600" y="520" font-size="30" fill="#FFFFFF" fill-opacity="0.6" font-weight="bold">
      A CEO, A WRITER, AND ONE REAL AI DETAIL
    </text>
    <text x="600" y="555" font-size="24" fill="#FFFFFF" fill-opacity="0.45">
      buried under all of it
    </text>
  </g>

  <rect x="500" y="600" width="200" height="8" rx="4" fill="url(#accentSaber)"/>
</svg>
