<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Beast of Reincarnation review score 7 out of 10, average of eight critics">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#5A1330"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
    <linearGradient id="split" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D6294E"/>
      <stop offset="100%" stop-color="#B600A8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="140" font-size="22" letter-spacing="6" fill="#FFFFFF" fill-opacity="0.55" font-weight="bold">
      REVIEW ROUNDUP
    </text>

    <text x="600" y="230" font-size="40" font-weight="900" fill="#FFFFFF">BEAST OF REINCARNATION</text>
    <text x="600" y="280" font-size="24" fill="#FFFFFF" fill-opacity="0.6" font-weight="bold">
      GAME FREAK'S FIRST NON-POKEMON GAME
    </text>

    <text x="600" y="460" font-size="220" font-weight="900" fill="#FFFFFF">7.0</text>
    <text x="600" y="520" font-size="26" fill="#FFFFFF" fill-opacity="0.6" font-weight="bold">
      AVERAGE OF 8 CRITIC SCORES
    </text>
  </g>

  <g stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3">
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  <rect x="0" y="600" width="1200" height="10" fill="url(#split)"/>

  <text x="600" y="670" font-size="24" fill="#FFFFFF" fill-opacity="0.45" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    critics split almost down the middle
  </text>
</svg>
