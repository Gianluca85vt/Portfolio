<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Steam Deck framerate data on Steam store pages">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18011F"/>
      <stop offset="1" stop-color="#7621B0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>

  <text x="80" y="128" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="5" fill="#E7C8FF" opacity="0.85">STEAM DECK · STORE PAGES</text>

  <text x="80" y="330" font-family="Helvetica, Arial, sans-serif" font-size="210" font-weight="700" fill="#FFFFFF">75 FPS</text>

  <text x="80" y="404" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="500" fill="#F0DBFF">the average of 90, 90, 45, 90, 90, 45</text>
  <text x="80" y="466" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">a framerate the game never renders</text>

  <g fill="#E7C8FF" opacity="0.9">
    <rect x="80"  y="600" width="54" height="40"/>
    <rect x="152" y="572" width="54" height="68"/>
    <rect x="224" y="520" width="54" height="120"/>
    <rect x="296" y="640" width="54" height="0.5"/>
    <rect x="368" y="612" width="54" height="28"/>
    <rect x="440" y="548" width="54" height="92"/>
    <rect x="512" y="470" width="54" height="170"/>
    <rect x="584" y="500" width="54" height="140"/>
  </g>
  <rect x="80" y="644" width="558" height="3" fill="#FFFFFF" opacity="0.55"/>
  <text x="80" y="700" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#E7C8FF" opacity="0.9">the distribution is the part worth reading</text>

  <text x="80" y="820" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="500" letter-spacing="2" fill="#E7C8FF" opacity="0.7">VALVE CLIENT UPDATE · 10 NOVEMBER 2026</text>
</svg>
