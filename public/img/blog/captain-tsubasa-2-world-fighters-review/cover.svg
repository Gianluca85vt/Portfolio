<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Captain Tsubasa 2: World Fighters review, 8 out of 10 from five verdicts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="58%" stop-color="#4A0A2B"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18011F" stop-opacity="0"/>
      <stop offset="100%" stop-color="#18011F" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#fade)"/>

  <g font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="80" y="118" fill="#FFFFFF" fill-opacity="0.62" font-size="26" font-weight="600" letter-spacing="6">REVIEW ROUND-UP</text>

    <text x="80" y="236" fill="#FFFFFF" font-size="54" font-weight="700">CAPTAIN TSUBASA 2</text>
    <text x="80" y="298" fill="#FFFFFF" fill-opacity="0.72" font-size="40" font-weight="500">WORLD FIGHTERS</text>

    <text x="80" y="512" fill="#FFFFFF" font-size="210" font-weight="800" letter-spacing="-6">8<tspan fill-opacity="0.45" font-size="112" font-weight="600">/10</tspan></text>

    <text x="80" y="574" fill="#FFFFFF" fill-opacity="0.78" font-size="30" font-weight="500">Average of five published verdicts</text>
    <text x="80" y="618" fill="#FFFFFF" fill-opacity="0.55" font-size="26" font-weight="400">Spectacle against flow — 28 August 2026</text>
  </g>

  <rect x="80" y="654" width="150" height="7" rx="3.5" fill="#D6294E"/>
</svg>
