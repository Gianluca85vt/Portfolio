<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="DLSS 5 neural rendering costs 50 to 60 percent of the frame rate">
  <defs>
    <linearGradient id="bgNr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="58%" stop-color="#062E3C"/>
      <stop offset="100%" stop-color="#12A2B8"/>
    </linearGradient>
    <linearGradient id="barNr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#12A2B8"/>
      <stop offset="100%" stop-color="#9FF0FA"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgNr)"/>

  <!-- faint scanline field, the frame being handed over -->
  <g opacity="0.10" fill="#9FF0FA">
    <rect x="0" y="120" width="1200" height="2"/>
    <rect x="0" y="188" width="1200" height="2"/>
    <rect x="0" y="256" width="1200" height="2"/>
    <rect x="0" y="324" width="1200" height="2"/>
    <rect x="0" y="392" width="1200" height="2"/>
  </g>

  <text x="90" y="150" font-family="Helvetica, Arial, sans-serif" font-size="34" letter-spacing="7" fill="#9FF0FA" opacity="0.85">DLSS 5 NEURAL RENDERING</text>

  <text x="86" y="368" font-family="Helvetica, Arial, sans-serif" font-size="228" font-weight="700" fill="#FFFFFF">50-60%</text>

  <text x="90" y="440" font-family="Helvetica, Arial, sans-serif" font-size="44" fill="#DFF7FC">of the frame rate, as a flat tax</text>

  <rect x="90" y="492" width="620" height="10" rx="5" fill="url(#barNr)"/>
  <rect x="710" y="492" width="400" height="10" rx="5" fill="#FFFFFF" opacity="0.18"/>

  <text x="90" y="566" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#9FF0FA" opacity="0.9">A ReShade add-on moves the pass to a second GPU</text>
</svg>
