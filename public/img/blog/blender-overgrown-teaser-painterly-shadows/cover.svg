<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="OVERGROWN's painterly shadows are solved in the geometry that casts them">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="60%" stop-color="#4A2A10"/>
      <stop offset="100%" stop-color="#BE4C00"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>

  <g font-family="Inter, Helvetica Neue, Arial, sans-serif">
    <text x="80" y="122" fill="#F0B48A" font-size="27" font-weight="600" letter-spacing="5.5">OVERGROWN / BLENDER STUDIO</text>

    <text x="80" y="330" fill="#FFFFFF" font-size="178" font-weight="800" letter-spacing="-6">Fix the</text>
    <text x="80" y="470" fill="#FFFFFF" font-size="178" font-weight="800" letter-spacing="-6">caster</text>

    <text x="80" y="566" fill="#F6D9C4" font-size="38" font-weight="500">not the shadow</text>

    <text x="80" y="818" fill="#E7B896" font-size="30" font-weight="500">First teaser, 14 September 2026</text>
  </g>
</svg>
