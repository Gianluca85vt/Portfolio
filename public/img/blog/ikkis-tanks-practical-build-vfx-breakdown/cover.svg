<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Eight months, built to actually drive">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#3A1204"/>
      <stop offset="100%" stop-color="#BE4C00"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B600A8"/>
      <stop offset="100%" stop-color="#BE4C00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2">
    <path d="M0 150H1200M0 300H1200M0 450H1200M0 600H1200"/>
    <path d="M150 0V900M300 0V900M450 0V900M600 0V900M750 0V900M900 0V900M1050 0V900"/>
  </g>

  <!-- simplified tank silhouette -->
  <g fill="#FFFFFF" fill-opacity="0.08">
    <rect x="320" y="640" width="560" height="60" rx="10"/>
    <rect x="380" y="580" width="300" height="70" rx="8"/>
    <rect x="560" y="520" width="220" height="20"/>
    <circle cx="380" cy="700" r="26"/>
    <circle cx="460" cy="700" r="26"/>
    <circle cx="540" cy="700" r="26"/>
    <circle cx="620" cy="700" r="26"/>
    <circle cx="700" cy="700" r="26"/>
    <circle cx="780" cy="700" r="26"/>
  </g>

  <g font-family="Arial Black, Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="180" font-size="32" letter-spacing="8" fill="#FFFFFF" fill-opacity="0.55"
          font-family="Arial, Helvetica, sans-serif" font-weight="bold">IKKIS — BATTLE OF BASANTAR</text>

    <text x="600" y="330" font-size="170" font-weight="900" fill="#FFFFFF">8 MONTHS</text>

    <text x="600" y="400" font-size="34" fill="#FFFFFF" fill-opacity="0.5"
          font-family="Arial, Helvetica, sans-serif" font-weight="bold">
      BUILDING TANKS THAT ACTUALLY DRIVE
    </text>
  </g>

  <rect x="500" y="450" width="200" height="8" rx="4" fill="url(#accent)"/>
</svg>
