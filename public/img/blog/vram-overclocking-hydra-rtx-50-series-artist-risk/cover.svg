<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Hydra unlocks VRAM overclocking to 36 Gbps on RTX 50-series GPUs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#2C1247"/>
      <stop offset="100%" stop-color="#7621B0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B600A8"/>
      <stop offset="100%" stop-color="#7621B0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- faint memory-bus trace grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2">
    <path d="M0 150H1200M0 300H1200M0 450H1200M0 600H1200"/>
    <path d="M150 0V900M300 0V900M450 0V900M600 0V900M750 0V900M900 0V900M1050 0V900"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="150" font-size="28" letter-spacing="6" fill="#FFFFFF" fill-opacity="0.5"
          font-weight="bold">RTX 50-SERIES · GDDR7</text>

    <text x="600" y="370" font-size="160" font-weight="900" fill="#FFFFFF">36 Gbps</text>

    <text x="600" y="440" font-size="32" fill="#FFFFFF" fill-opacity="0.5" font-weight="bold">
      VRAM OVERCLOCK, HYDRA 2.3B
    </text>
  </g>

  <rect x="500" y="490" width="200" height="8" rx="4" fill="url(#accent)"/>

  <text x="600" y="570" font-size="24" fill="#FFFFFF" fill-opacity="0.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    fine for frame rate. risky for a render you're shipping.
  </text>
</svg>
