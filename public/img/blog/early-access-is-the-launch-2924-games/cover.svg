<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Only 21 per cent of games earn more after leaving Early Access">
  <defs>
    <linearGradient id="bgEA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="58%" stop-color="#5A0F28"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
    <linearGradient id="ruleEA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D6294E"/>
      <stop offset="100%" stop-color="#FFC2CF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgEA)"/>

  <!-- release-volume bars: 2024, 2025, 2026 share of Steam releases -->
  <g>
    <rect x="150" y="610" width="90" height="104" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect x="270" y="597" width="90" height="117" fill="#FFFFFF" fill-opacity="0.26"/>
    <rect x="390" y="567" width="90" height="147" fill="#FFC2CF" fill-opacity="0.55"/>
  </g>
  <g stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5">
    <line x1="150" y1="714" x2="1050" y2="714"/>
  </g>
  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#FFFFFF" fill-opacity="0.5" font-size="22">
    <text x="195" y="752">10.4%</text>
    <text x="315" y="752">11.3%</text>
    <text x="435" y="752">13.7%</text>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="600" y="132" font-size="26" letter-spacing="7" fill="#FFFFFF" fill-opacity="0.45">STEAM EARLY ACCESS, 2026</text>

    <text x="600" y="330" font-size="190" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">21%</text>

    <text x="600" y="406" font-size="40" fill="#FFFFFF" fill-opacity="0.72">EARN MORE AFTER 1.0</text>
    <text x="600" y="462" font-size="30" fill="#FFFFFF" fill-opacity="0.5">THAN THEY DID ON DAY ONE</text>
  </g>

  <rect x="500" y="505" width="200" height="8" rx="4" fill="url(#ruleEA)"/>
</svg>
