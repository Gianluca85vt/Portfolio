<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="RTX Mega Geometry 2.0 streams 31GB of mesh data as 1.5GB of VRAM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#2A1140"/>
      <stop offset="100%" stop-color="#7621B0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B600A8"/>
      <stop offset="100%" stop-color="#BE4C00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2">
    <path d="M0 150H1200M0 300H1200M0 450H1200M0 600H1200"/>
    <path d="M150 0V900M300 0V900M450 0V900M600 0V900M750 0V900M900 0V900M1050 0V900"/>
  </g>

  <g font-family="Arial Black, Arial, Helvetica, sans-serif">
    <text x="80" y="140" fill="#FFFFFF" fill-opacity="0.55" font-size="34" letter-spacing="6">RTX MEGA GEOMETRY 2.0</text>
    <text x="80" y="310" fill="#FFFFFF" font-size="150">31GB of mesh</text>
    <text x="80" y="430" fill="url(#accent)" font-size="150">1.5GB of VRAM</text>
    <rect x="80" y="480" width="300" height="8" fill="url(#accent)"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="80" y="570" fill="#FFFFFF" fill-opacity="0.8" font-size="40">Streaming clusters on demand.</text>
    <text x="80" y="625" fill="#FFFFFF" fill-opacity="0.8" font-size="40">It sheds detail before it runs out.</text>
  </g>
</svg>
