<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="A film crew count set against an AI slop accusation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#40074B"/>
      <stop offset="100%" stop-color="#B600A8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7621B0"/>
      <stop offset="100%" stop-color="#B600A8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <g fill="#FFFFFF" fill-opacity="0.05">
    <rect x="0" y="120" width="1200" height="2"/>
    <rect x="0" y="470" width="1200" height="2"/>
  </g>

  <text x="90" y="112" fill="#FFFFFF" fill-opacity="0.55" font-family="Helvetica, Arial, sans-serif" font-size="30" letter-spacing="6">HUMANKIND 2 — ANNOUNCEMENT TRAILER</text>

  <text x="90" y="290" fill="#FFFFFF" font-family="Helvetica, Arial, sans-serif" font-size="200" font-weight="700">150</text>
  <text x="90" y="370" fill="#FFFFFF" fill-opacity="0.82" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="600">crew on a real sound stage</text>
  <text x="90" y="440" fill="#FFFFFF" fill-opacity="0.6" font-family="Helvetica, Arial, sans-serif" font-size="40">25 actors · 100+ extras · a pig, five chickens, dozens of rats</text>

  <rect x="90" y="540" width="620" height="4" fill="url(#accent)"/>
  <text x="90" y="620" fill="#FFFFFF" fill-opacity="0.72" font-family="Helvetica, Arial, sans-serif" font-size="44">The comments still said “AI slop”.</text>
  <text x="90" y="686" fill="#FFFFFF" fill-opacity="0.45" font-family="Helvetica, Arial, sans-serif" font-size="34">Nu Boyana Film Studios, Sofia · behind-the-scenes 4 Sep 2026</text>
</svg>
