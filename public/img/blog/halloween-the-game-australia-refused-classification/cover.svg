<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Halloween: The Game refused classification in Australia">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#3A0F1E"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2">
    <path d="M0 150H1200M0 210H1200M0 270H1200"/>
  </g>

  <text x="80" y="140" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#FFFFFF" fill-opacity="0.62" letter-spacing="6">HALLOWEEN: THE GAME</text>

  <text x="80" y="330" font-family="Helvetica, Arial, sans-serif" font-size="190" font-weight="700" fill="#FFFFFF">REFUSED</text>
  <text x="80" y="480" font-family="Helvetica, Arial, sans-serif" font-size="112" font-weight="700" fill="#FFFFFF" fill-opacity="0.88">CLASSIFICATION</text>

  <rect x="80" y="540" width="150" height="5" fill="#D6294E"/>

  <text x="80" y="625" font-family="Helvetica, Arial, sans-serif" font-size="42" fill="#FFFFFF" fill-opacity="0.8">Australia, over a power-up</text>
  <text x="80" y="680" font-family="Helvetica, Arial, sans-serif" font-size="42" fill="#FFFFFF" fill-opacity="0.8">that gets you high</text>

  <text x="80" y="820" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#FFFFFF" fill-opacity="0.5" letter-spacing="3">LAUNCH DAY — 8 SEPTEMBER 2026</text>
</svg>
