<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="RTX 5090 reportedly discontinued: the consumer VRAM ceiling drops from 32GB to 24GB">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18011F"/>
      <stop offset="1" stop-color="#7621B0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="90" y="150" font-size="34" letter-spacing="6" opacity="0.72">TECH / NVIDIA</text>
    <text x="90" y="330" font-size="190" font-weight="700">32GB</text>
    <text x="90" y="440" font-size="96" font-weight="300" opacity="0.8">drops to 24</text>
    <text x="90" y="540" font-size="40" opacity="0.9">RTX 5090 reportedly out of production</text>
    <text x="90" y="595" font-size="40" opacity="0.65">GB202 reserved for pro and data centre cards</text>
    <rect x="90" y="650" width="150" height="5" fill="#ffffff" opacity="0.5"/>
    <text x="90" y="720" font-size="30" opacity="0.6">Unconfirmed by Nvidia &#183; 13 October 2026</text>
  </g>
</svg>
