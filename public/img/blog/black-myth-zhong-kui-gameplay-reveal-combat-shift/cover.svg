<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Black Myth Zhong Kui first gameplay reveal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#3A0F1E"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D6294E"/>
      <stop offset="100%" stop-color="#BE4C00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- faint vertical strokes, like brush / calligraphy lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="3">
    <path d="M180 0V900M360 0V900M540 0V900M720 0V900M900 0V900M1080 0V900"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="170" font-size="30" letter-spacing="8" fill="#FFFFFF" fill-opacity="0.55"
          font-weight="bold">BLACK MYTH: ZHONG KUI</text>

    <text x="600" y="330" font-size="90" font-weight="900" fill="#FFFFFF">15 MINUTES</text>
    <text x="600" y="410" font-size="34" fill="#FFFFFF" fill-opacity="0.7" font-weight="bold">
      OF GAMEPLAY, FIRST LOOK
    </text>

    <text x="600" y="500" font-size="30" fill="#FFFFFF" fill-opacity="0.5" font-weight="bold">
      STAFF &amp; ACROBATICS &#8594; SWORD, BLOCK, PARRY
    </text>
  </g>

  <rect x="480" y="540" width="240" height="8" rx="4" fill="url(#accent)"/>
</svg>
