<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Build A Rocket Boy reportedly closing after new layoffs">
  <defs>
    <linearGradient id="bgBarb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="60%" stop-color="#2B0A3A"/>
      <stop offset="100%" stop-color="#7A1F4B"/>
    </linearGradient>
    <linearGradient id="ruleBarb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7A1F4B"/>
      <stop offset="100%" stop-color="#FFB3C8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgBarb)"/>

  <!-- headcount falling away -->
  <g fill="#FFFFFF" fill-opacity="0.13">
    <rect x="120" y="600" width="26" height="190"/>
    <rect x="170" y="640" width="26" height="150"/>
    <rect x="220" y="672" width="26" height="118"/>
    <rect x="270" y="700" width="26" height="90"/>
    <rect x="320" y="732" width="26" height="58"/>
    <rect x="370" y="758" width="26" height="32"/>
    <rect x="420" y="778" width="26" height="12"/>
  </g>
  <g stroke="#FFB3C8" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M133 600 L433 784"/>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="600" y="130" font-size="26" letter-spacing="8" fill="#FFFFFF" fill-opacity="0.45">BUILD A ROCKET BOY</text>

    <text x="600" y="290" font-size="150" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">448 &#8594; 202</text>

    <text x="600" y="382" font-size="34" fill="#FFFFFF" fill-opacity="0.66">STAFF, END OF 2024 TO JUNE 2026</text>
    <text x="600" y="444" font-size="34" fill="#FFFFFF" fill-opacity="0.66">AND THEN REPORTEDLY NONE</text>
  </g>

  <rect x="500" y="500" width="200" height="8" rx="4" fill="url(#ruleBarb)"/>
</svg>
