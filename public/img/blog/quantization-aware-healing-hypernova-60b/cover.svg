<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="A model compressed from 61 gigabytes to 32 gigabytes of VRAM">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#3A0A45"/>
      <stop offset="100%" stop-color="#B600A8"/>
    </linearGradient>
    <linearGradient id="accent4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7621B0"/>
      <stop offset="100%" stop-color="#B600A8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg4)"/>

  <g text-anchor="middle">
    <text x="600" y="170" font-size="30" letter-spacing="8" fill="#FFFFFF" fill-opacity="0.5"
          font-family="Arial, Helvetica, sans-serif" font-weight="bold">QUANTIZATION-AWARE HEALING</text>
  </g>

  <!-- a bar shrinking from 61 to 32, the whole story in one shape -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="900" fill="#FFFFFF">
    <rect x="180" y="330" width="840" height="90" rx="10" fill="#FFFFFF" fill-opacity="0.10"/>
    <text x="220" y="392" font-size="52" fill-opacity="0.55">61GB</text>

    <rect x="180" y="470" width="440" height="90" rx="10" fill="url(#accent4)"/>
    <text x="220" y="532" font-size="52">32GB</text>
  </g>

  <g text-anchor="middle">
    <text x="600" y="660" font-size="30" letter-spacing="3" fill="#FFFFFF" fill-opacity="0.55"
          font-family="Arial, Helvetica, sans-serif" font-weight="bold">HYPERNOVA 60B · 4-BIT · APACHE 2.0</text>
  </g>
</svg>
