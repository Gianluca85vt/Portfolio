<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Yuriten cancels its anniversary event over AI promotional art">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#18011F"/>
      <stop offset="1" stop-color="#C8891B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <text x="90" y="170" font-family="Helvetica, Arial, sans-serif" font-size="34" letter-spacing="4" fill="#F3E4C8" opacity="0.85">YURITEN — 10TH ANNIVERSARY</text>
  <text x="90" y="330" font-family="Helvetica, Arial, sans-serif" font-size="150" font-weight="700" fill="#FFFFFF">Cancelled</text>
  <text x="90" y="430" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#F3E4C8">over a generated teaser</text>
  <text x="90" y="530" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#F3E4C8" opacity="0.9">The decorations were generated too</text>
</svg>
