<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="True Depth V3: one photo in, 3D scene out">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#3A1608"/>
      <stop offset="100%" stop-color="#BE4C00"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#BE4C00"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- depth-map style contour bands -->
  <g stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3" fill="none">
    <path d="M-50 380 C 250 300, 450 460, 700 340 S 1150 400, 1300 320"/>
    <path d="M-50 440 C 250 360, 450 520, 700 400 S 1150 460, 1300 380"/>
    <path d="M-50 500 C 250 420, 450 580, 700 460 S 1150 520, 1300 440"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="170" font-size="30" letter-spacing="8" fill="#FFFFFF" fill-opacity="0.55"
          font-weight="bold">BLENDER ADD-ON</text>

    <text x="600" y="330" font-size="118" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">TRUE DEPTH</text>

    <text x="600" y="410" font-size="60" font-weight="900" fill="#FFFFFF" fill-opacity="0.9"
          font-family="Arial Black, Arial, Helvetica, sans-serif">V3</text>

    <text x="600" y="480" font-size="34" fill="#FFFFFF" fill-opacity="0.5" font-weight="bold">
      1 PHOTO <tspan fill="#FFFFFF" fill-opacity="0.85">&#8594;</tspan> 3D SCENE
    </text>
  </g>

  <rect x="500" y="530" width="200" height="8" rx="4" fill="url(#accent)"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.45">
    <text x="600" y="600" font-size="26" font-weight="bold">DEPTH ANYTHING &#183; LOCAL &#183; ONE CLICK</text>
  </g>
</svg>
