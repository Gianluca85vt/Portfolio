<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Phone-based Gaussian splat scanning goes fully offline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#3A1608"/>
      <stop offset="100%" stop-color="#BE4C00"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#BE4C00"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="splat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- scattered splat blobs, standing in for a point cloud -->
  <g fill="url(#splat)">
    <circle cx="150" cy="330" r="60"/>
    <circle cx="260" cy="260" r="34"/>
    <circle cx="1040" cy="300" r="70"/>
    <circle cx="950" cy="220" r="30"/>
    <circle cx="90" cy="500" r="26"/>
    <circle cx="1110" cy="480" r="40"/>
    <circle cx="1000" cy="560" r="22"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="170" font-size="28" letter-spacing="7" fill="#FFFFFF" fill-opacity="0.55"
          font-weight="bold">PHONE 3D CAPTURE</text>

    <text x="600" y="320" font-size="96" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">GAUSSIAN</text>

    <text x="600" y="410" font-size="96" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">SPLATS</text>

    <text x="600" y="480" font-size="34" fill="#FFFFFF" fill-opacity="0.5" font-weight="bold">
      NO CLOUD <tspan fill="#FFFFFF" fill-opacity="0.85">&#8594;</tspan> NO ACCOUNT
    </text>
  </g>

  <rect x="500" y="530" width="200" height="8" rx="4" fill="url(#accent)"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.45">
    <text x="600" y="600" font-size="26" font-weight="bold">ON-DEVICE &#183; OFFLINE &#183; STILL NOT A MESH</text>
  </g>
</svg>
