<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="The Blood of Dawnwalker gets a 60fps Performance mode after all, three days after Rebel Wolves said it wasn't coming">
  <defs>
    <linearGradient id="bgR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#5A1030"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
    <linearGradient id="accentR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3f4fc9"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgR)"/>

  <rect x="0" y="0" width="600" height="900" fill="#3f4fc9" opacity="0.14"/>
  <rect x="600" y="0" width="600" height="900" fill="#c96a3f" opacity="0.12"/>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="600" y="130" font-size="26" letter-spacing="6" fill="#FFFFFF" fill-opacity="0.55">THE BLOOD OF DAWNWALKER</text>

    <text x="600" y="320" font-size="120" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">60FPS</text>

    <text x="600" y="390" font-size="36" font-weight="900" fill="#FFFFFF" fill-opacity="0.92"
          font-family="Arial Black, Arial, Helvetica, sans-serif">AFTER ALL — THREE DAYS LATER</text>

    <text x="600" y="450" font-size="22" letter-spacing="2" fill="#FFFFFF" fill-opacity="0.65">PS5 · PS5 PRO · SERIES X — NOT SERIES S</text>
  </g>

  <rect x="500" y="500" width="200" height="8" rx="4" fill="url(#accentR)"/>
</svg>
