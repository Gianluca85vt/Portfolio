<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Blender to Krita texture painting over a WebSocket, with nine viewport passes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#4A1508"/>
      <stop offset="100%" stop-color="#BE4C00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- nine stacked pass cards -->
  <g fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.16">
    <rect x="196" y="96" width="150" height="86" rx="6"/>
    <rect x="360" y="96" width="150" height="86" rx="6"/>
    <rect x="524" y="96" width="150" height="86" rx="6"/>
    <rect x="688" y="96" width="150" height="86" rx="6"/>
    <rect x="852" y="96" width="150" height="86" rx="6"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="256" font-size="26" letter-spacing="6" fill="#FFFFFF" fill-opacity="0.55"
          font-weight="bold">BLENDER &#8594; KRITA, IN MEMORY</text>

    <text x="600" y="392" font-size="168" font-weight="900" fill="#FFFFFF">9</text>
    <text x="600" y="452" font-size="44" font-weight="900" fill="#FFFFFF" fill-opacity="0.94">PASSES UNDER THE BRUSH</text>
  </g>

  <text x="600" y="512" font-family="Arial, Helvetica, sans-serif" text-anchor="middle"
        font-size="23" fill="#FFFFFF" fill-opacity="0.5" font-weight="bold">
    COLOUR ID &#183; DEPTH &#183; NORMALS &#183; AO &#183; WIREFRAME
  </text>
</svg>
