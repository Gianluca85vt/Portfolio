<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Paramount's Warner merger: a floor of 30 theatrical films a year">
  <defs>
    <linearGradient id="bgPW" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#2A1140"/>
      <stop offset="100%" stop-color="#5B3FBF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgPW)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2">
    <path d="M0 600H1200M0 660H1200M0 720H1200M0 780H1200"/>
  </g>

  <text x="90" y="150" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#C9B8FF" letter-spacing="6">PARAMOUNT / WARNER BROS. DISCOVERY</text>

  <text x="90" y="400" font-family="Helvetica,Arial,sans-serif" font-size="290" font-weight="700" fill="#FFFFFF">30</text>
  <text x="380" y="400" font-family="Helvetica,Arial,sans-serif" font-size="66" font-weight="600" fill="#FFFFFF">films a year,</text>
  <text x="380" y="470" font-family="Helvetica,Arial,sans-serif" font-size="66" font-weight="600" fill="#C9B8FF">in writing</text>

  <text x="90" y="560" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#E6DCFF">$110bn deal, 12 states settled, 21 September 2026</text>

  <rect x="90" y="610" width="220" height="5" fill="#7A5CFF"/>
</svg>
