<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="DDR6's four times bandwidth figure is measured against DDR5-4800, the 2020 launch grade">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#3B1060"/>
      <stop offset="100%" stop-color="#7621B0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C77DFF"/>
      <stop offset="100%" stop-color="#EBD4FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <text x="80" y="140" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#C77DFF" letter-spacing="6">JEDEC · DDR6 PREVIEW</text>
  <text x="80" y="340" font-family="Helvetica, Arial, sans-serif" font-size="200" font-weight="700" fill="url(#accent)">4.00×</text>
  <text x="80" y="408" font-family="Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF">measured against DDR5-4800</text>
  <text x="80" y="470" font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#E6D2F5">2.09× against DDR5 at 9.2 GT/s</text>
  <rect x="80" y="522" width="300" height="5" fill="#C77DFF"/>
  <text x="80" y="606" font-family="Helvetica, Arial, sans-serif" font-size="42" fill="#FFFFFF">12.8 GT/s · 96-bit bus · 128Gb dies</text>
  <text x="80" y="664" font-family="Helvetica, Arial, sans-serif" font-size="42" fill="#FFFFFF">74mm module, down from 133mm</text>
  <text x="80" y="760" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#C9A8E0">Server RDIMMs only. No UDIMM spec, no date — 19 November 2026</text>
</svg>
