<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Marvelous Designer 2026.1 adds a Seamline Ripping Tool">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#4A1B08"/>
      <stop offset="100%" stop-color="#BE4C00"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#BE4C00"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- faint torn seam line -->
  <g stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3" fill="none">
    <path d="M120 260 L300 245 L340 275 L520 250 L560 285 L760 255 L800 290 L1080 260"/>
  </g>
  <g stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2">
    <path d="M0 500H1200M0 560H1200"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="150" font-size="26" letter-spacing="7" fill="#FFFFFF" fill-opacity="0.55"
          font-weight="bold">MARVELOUS DESIGNER 2026.1</text>

    <text x="600" y="340" font-size="72" font-weight="900" fill="#FFFFFF">SEAMLINE</text>
    <text x="600" y="415" font-size="72" font-weight="900" fill="#FFFFFF">RIPPING TOOL</text>

    <text x="600" y="480" font-size="26" fill="#FFFFFF" fill-opacity="0.6" font-weight="bold">
      RIP · PINCH · SHAPE — IN THE SIM
    </text>
  </g>

  <rect x="480" y="640" width="240" height="8" rx="4" fill="url(#accent)"/>
</svg>
