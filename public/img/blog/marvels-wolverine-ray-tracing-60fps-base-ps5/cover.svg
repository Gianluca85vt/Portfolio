<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Marvel's Wolverine runs ray tracing at 60fps on base PS5">
  <defs>
    <linearGradient id="bgW" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="50%" stop-color="#5A1030"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
    <linearGradient id="accentW" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D6294E"/>
      <stop offset="100%" stop-color="#B600A8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgW)"/>

  <!-- three claw slashes -->
  <g stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="14" stroke-linecap="round">
    <path d="M120 40 L260 260"/>
    <path d="M190 30 L330 250"/>
    <path d="M260 20 L400 240"/>
  </g>
  <g stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="14" stroke-linecap="round">
    <path d="M940 40 L1080 260"/>
    <path d="M1010 30 L1150 250"/>
    <path d="M1080 20 L1180 200"/>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="600" y="150" font-size="30" letter-spacing="8" fill="#FFFFFF" fill-opacity="0.5">MARVEL'S WOLVERINE</text>

    <text x="600" y="330" font-size="150" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">60FPS</text>

    <text x="600" y="410" font-size="46" font-weight="900" fill="#FFFFFF" fill-opacity="0.92"
          font-family="Arial Black, Arial, Helvetica, sans-serif">+ RAY TRACING, DEFAULT</text>

    <text x="600" y="465" font-size="26" letter-spacing="4" fill="#FFFFFF" fill-opacity="0.6">ON BASE PS5, NOT THE PRO</text>
  </g>

  <rect x="500" y="500" width="200" height="8" rx="4" fill="url(#accentW)"/>
</svg>
