<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Warren Spector retires after 44 years, immersive sim design legacy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#5A1330"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D6294E"/>
      <stop offset="100%" stop-color="#7621B0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- branching corridor routes, nod to multi-path level design -->
  <g stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="4" fill="none">
    <path d="M100 850 C 250 650, 200 500, 350 350"/>
    <path d="M100 850 C 300 750, 450 650, 350 350"/>
    <path d="M350 350 C 500 250, 700 250, 850 150"/>
    <path d="M350 350 C 450 400, 600 420, 850 150"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.35">
    <circle cx="100" cy="850" r="7"/>
    <circle cx="350" cy="350" r="7"/>
    <circle cx="850" cy="150" r="7"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="170" font-size="26" letter-spacing="6" fill="#FFFFFF" fill-opacity="0.55" font-weight="bold">
      44 YEARS · ULTIMA · SYSTEM SHOCK · DEUS EX
    </text>

    <text x="600" y="420" font-size="92" font-weight="900" fill="#FFFFFF">WARREN</text>
    <text x="600" y="510" font-size="92" font-weight="900" fill="#FFFFFF">SPECTOR</text>

    <text x="600" y="580" font-size="32" fill="#FFFFFF" fill-opacity="0.6" font-weight="bold">
      RETIRES
    </text>
  </g>

  <rect x="500" y="630" width="200" height="8" rx="4" fill="url(#accent)"/>

  <text x="600" y="700" font-size="26" fill="#FFFFFF" fill-opacity="0.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    the world was supposed to remember what you did
  </text>
</svg>
