<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Bleach finale: the last two episodes slipped four weeks">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18011F"/>
      <stop offset="1" stop-color="#C8891B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#g)"/>
  <text x="90" y="170" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#F3E6D2" letter-spacing="5">BLEACH · 2004 – 2026</text>
  <text x="90" y="360" font-family="Helvetica, Arial, sans-serif" font-size="210" font-weight="700" fill="#FFFFFF">4 weeks</text>
  <text x="90" y="450" font-family="Helvetica, Arial, sans-serif" font-size="46" fill="#F3E6D2">late, on episodes 49 and 50 of 50</text>
