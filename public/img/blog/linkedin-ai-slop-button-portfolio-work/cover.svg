<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="A report button next to a render, both flagged the same way">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#40074B"/>
      <stop offset="100%" stop-color="#B600A8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7621B0"/>
      <stop offset="100%" stop-color="#B600A8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <g fill="#FFFFFF" fill-opacity="0.06">
    <g id="grid-row">
      <rect x="90" y="90" width="70" height="70" rx="6"/>
      <rect x="190" y="90" width="70" height="70" rx="6"/>
      <rect x="290" y="90" width="70" height="70" rx="6"/>
      <rect x="390" y="90" width="70" height="70" rx="6"/>
      <rect x="490" y="90" width="70" height="70" rx="6"/>
    </g>
    <use href="#grid-row" y="100"/>
    <use href="#grid-row" y="200"/>
  </g>

  <g text-anchor="middle">
    <text x="600" y="200" font-size="30" letter-spacing="8" fill="#FFFFFF" fill-opacity="0.55"
          font-family="Arial, Helvetica, sans-serif" font-weight="bold">1,000,000+ CLICKS</text>

    <text x="600" y="420" font-size="120" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">SEEMS LIKE</text>
    <text x="600" y="540" font-size="120" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">AI SLOP</text>

    <text x="600" y="610" font-size="32" letter-spacing="3" fill="#FFFFFF" fill-opacity="0.6"
          font-family="Arial, Helvetica, sans-serif" font-weight="bold">— OR JUST A CLEAN RENDER —</text>
  </g>

  <rect x="500" y="650" width="200" height="8" rx="4" fill="url(#accent)"/>
</svg>
