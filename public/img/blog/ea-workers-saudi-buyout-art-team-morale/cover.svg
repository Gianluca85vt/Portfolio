<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="EA workers speak out after the Saudi buyout, quote I feel dirty">
  <defs>
    <linearGradient id="bgEAW" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#5A1330"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
    <linearGradient id="accentEAW" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D6294E"/>
      <stop offset="100%" stop-color="#7621B0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgEAW)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2">
    <path d="M0 220H1200M0 370H1200M0 520H1200"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="150" font-size="24" letter-spacing="6" fill="#FFFFFF" fill-opacity="0.55" font-weight="bold">
      AFTER THE $55B EA BUYOUT
    </text>

    <text x="600" y="330" font-size="86" font-weight="900" fill="#FFFFFF"
          font-family="Georgia, 'Times New Roman', serif" font-style="italic">"I feel dirty"</text>

    <text x="600" y="420" font-size="30" fill="#FFFFFF" fill-opacity="0.7" font-weight="bold">
      EA EMPLOYEES, ON THE RECORD
    </text>

    <text x="600" y="480" font-size="26" fill="#FFFFFF" fill-opacity="0.45">
      even at studios nobody flagged as shaky
    </text>
  </g>

  <rect x="500" y="540" width="200" height="8" rx="4" fill="url(#accentEAW)"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="620" font-size="26" fill="#FFFFFF" fill-opacity="0.5" font-weight="bold">
      RESTRUCTURING HITS ART HEADCOUNT FIRST
    </text>
  </g>
</svg>
