    <linearGradient id="g" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#18011F"/>
      <stop offset="1" stop-color="#D6294E"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#g)"/>
  <text x="90" y="150" fill="#ffffff" opacity="0.72" font-family="Helvetica,Arial,sans-serif" font-size="34" letter-spacing="6">QUEEN'S DOMAIN</text>
