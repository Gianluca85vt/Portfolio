<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Cancelled Star Wars: Magellan footage leaks a year after the game died">
  <defs>
    <linearGradient id="bgMag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#5A1029"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
    <linearGradient id="accentMag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D6294E"/>
      <stop offset="100%" stop-color="#7621B0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgMag)"/>

  <!-- scattered wireframe blockout pieces, unfinished level greybox -->
  <g stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3" fill="none">
    <rect x="90" y="520" width="140" height="220"/>
    <rect x="230" y="600" width="90" height="140"/>
    <rect x="960" y="500" width="150" height="240"/>
    <rect x="880" y="640" width="90" height="100"/>
    <polygon points="60,740 260,740 220,620 100,620"/>
    <polygon points="940,760 1140,760 1110,600 970,600"/>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="600" y="140" font-size="30" letter-spacing="8" fill="#FFFFFF" fill-opacity="0.5">CANCELLED, LEAKED</text>

    <text x="600" y="280" font-size="80" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">STAR WARS</text>
    <text x="600" y="380" font-size="80" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">MAGELLAN</text>

    <text x="600" y="460" font-size="40" fill="#FFFFFF" fill-opacity="0.6">4 YEARS OF WORK</text>
  </g>

  <rect x="500" y="500" width="200" height="8" rx="4" fill="url(#accentMag)"/>
</svg>
