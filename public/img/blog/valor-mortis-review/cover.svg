<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Valor Mortis review scores run from 6 to 9, mean 7.5">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18011F"/>
      <stop offset="1" stop-color="#D6294E"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <text x="80" y="128" fill="#ffffff" opacity="0.72" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="600" letter-spacing="6">VALOR MORTIS</text>
  <text x="80" y="300" fill="#ffffff" font-family="Helvetica,Arial,sans-serif" font-size="180" font-weight="700">6 – 9</text>
  <text x="80" y="372" fill="#ffffff" opacity="0.92" font-family="Helvetica,Arial,sans-serif" font-size="46" font-weight="500">Seven verdicts, three points apart</text>
  <text x="80" y="438" fill="#ffffff" opacity="0.66" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="400">Mean 7.5 · read 18 October 2026</text>
  <rect x="80" y="470" width="420" height="4" fill="#ffffff" opacity="0.35"/>
</svg>
