<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="GoldenEye 007 decompilation reaches 100 percent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#2C1247"/>
      <stop offset="100%" stop-color="#7621B0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B600A8"/>
      <stop offset="100%" stop-color="#7621B0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- faint low-res texel grid, N64-era texture cache nod -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2">
    <path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200"/>
    <path d="M100 0V900M200 0V900M300 0V900M400 0V900M500 0V900M600 0V900M700 0V900M800 0V900M900 0V900M1000 0V900M1100 0V900"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="180" font-size="30" letter-spacing="8" fill="#FFFFFF" fill-opacity="0.5" font-weight="bold">
      GOLDENEYE 007 · N64 · 1997
    </text>

    <text x="600" y="400" font-size="180" font-weight="900" fill="#FFFFFF">100%</text>

    <text x="600" y="470" font-size="34" fill="#FFFFFF" fill-opacity="0.55" font-weight="bold">
      DECOMPILED, SOURCE-MATCHED
    </text>
  </g>

  <rect x="500" y="520" width="200" height="8" rx="4" fill="url(#accent)"/>

  <text x="600" y="600" font-size="26" fill="#FFFFFF" fill-opacity="0.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    half a decade of reverse engineering
  </text>
</svg>
