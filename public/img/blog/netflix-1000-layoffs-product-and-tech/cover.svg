<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Netflix cut 1,000 jobs, mostly in product and tech">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18011F"/>
      <stop offset="1" stop-color="#5B3FBF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <text x="90" y="150" font-family="Helvetica, Arial, sans-serif" font-size="34" letter-spacing="6" fill="#D7E2EA" fill-opacity="0.6">FILM &amp; TV</text>
  <text x="90" y="330" font-family="Helvetica, Arial, sans-serif" font-size="210" font-weight="700" fill="#FFFFFF">1,000</text>
  <text x="90" y="400" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="500" fill="#D7E2EA" fill-opacity="0.92">jobs cut, 6% of Netflix</text>
  <text x="90" y="470" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#D7E2EA" fill-opacity="0.72">Mostly product, technology,</text>
  <text x="90" y="524" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#D7E2EA" fill-opacity="0.72">legal and HR</text>
  <rect x="90" y="585" width="150" height="5" fill="#D7E2EA" fill-opacity="0.35"/>
</svg>
