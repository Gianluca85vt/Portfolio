<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Percy Jackson, Call of the Sirens">
  <defs>
    <linearGradient id="bgSiren" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#2A1550"/>
      <stop offset="100%" stop-color="#5B3FBF"/>
    </linearGradient>
    <radialGradient id="glowSiren" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#8F7BE0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8F7BE0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgSiren)"/>
  <rect width="1200" height="900" fill="url(#glowSiren)"/>

  <!-- scatter of barnacle/shell clusters, denser toward the top half -->
  <g fill="#FFFFFF" fill-opacity="0.10">
    <circle cx="150" cy="120" r="14"/>
    <circle cx="185" cy="100" r="9"/>
    <circle cx="120" cy="95" r="7"/>
    <circle cx="1040" cy="150" r="16"/>
    <circle cx="1075" cy="180" r="10"/>
    <circle cx="1005" cy="185" r="8"/>
    <circle cx="250" cy="260" r="10"/>
    <circle cx="950" cy="290" r="12"/>
    <circle cx="90" cy="300" r="8"/>
    <circle cx="1110" cy="330" r="7"/>
  </g>

  <!-- cracked-rock texture lines across the lower band -->
  <g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3" fill="none">
    <path d="M0 700 L120 660 L260 705 L410 655 L560 700"/>
    <path d="M600 700 L740 650 L880 700 L1030 660 L1200 700"/>
    <path d="M0 760 L160 725 L340 770 L520 720 L700 765 L880 715 L1060 760 L1200 720"/>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="600" y="330" font-size="28" letter-spacing="8" fill="#FFFFFF" fill-opacity="0.55">PERCY JACKSON — SEASON 2</text>

    <text x="600" y="450" font-size="98" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">THE SIRENS</text>

    <text x="600" y="520" font-size="30" fill="#FFFFFF" fill-opacity="0.55">
      A SOLVER FOR EVERY BARNACLE
    </text>
  </g>

  <rect x="500" y="560" width="200" height="8" rx="4" fill="#8F7BE0"/>
</svg>
