    <text x="600" y="500" font-size="150" font-weight="900" fill="#FFFFFF">HATRED</text>

    <text x="600" y="565" font-size="30" fill="#FFFFFF" fill-opacity="0.5" font-weight="bold">
      REPORTEDLY 15 SEPT — WHAT THE PORT HAS TO CUT
    </text>
