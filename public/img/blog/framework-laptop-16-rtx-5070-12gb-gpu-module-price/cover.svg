<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Framework RTX 5070 12GB GPU module price">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#2A1140"/>
      <stop offset="100%" stop-color="#7621B0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B600A8"/>
      <stop offset="100%" stop-color="#BE4C00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2">
    <path d="M0 150H1200M0 300H1200M0 450H1200M0 600H1200"/>
    <path d="M150 0V900M300 0V900M450 0V900M600 0V900M750 0V900M900 0V900M1050 0V900"/>
  </g>

  <g font-family="Arial Black, Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="170" font-size="30" letter-spacing="8" fill="#FFFFFF" fill-opacity="0.5"
          font-family="Arial, Helvetica, sans-serif" font-weight="bold">RTX 5070 12GB MODULE</text>

    <text x="600" y="380" font-size="180" font-weight="900" fill="#FFFFFF">$1,199</text>

    <text x="600" y="450" font-size="34" fill="#FFFFFF" fill-opacity="0.45"
          font-family="Arial, Helvetica, sans-serif" font-weight="bold">
      8GB MODULE WAS <tspan text-decoration="line-through">$699</tspan>
    </text>
  </g>

  <rect x="480" y="500" width="240" height="8" rx="4" fill="url(#accent)"/>

  <text x="600" y="580" font-size="30" fill="#FFFFFF" fill-opacity="0.6" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    SAME CHASSIS. NO NEW MAINBOARD.
  </text>
</svg>
