<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Twenty-one original Xbox games added to PC backward compatibility, eleven of them Star Wars">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#3D1163"/>
      <stop offset="100%" stop-color="#7621B0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2">
    <path d="M0 160H1200M0 216H1200M0 272H1200"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="128" font-size="30" letter-spacing="7" fill="#FFFFFF" fill-opacity="0.55">ORIGINAL XBOX ON PC</text>

    <text x="600" y="330" font-size="210" font-weight="bold" fill="#FFFFFF">21</text>
    <text x="600" y="396" font-size="38" fill="#FFFFFF" fill-opacity="0.82">games added, 12 November 2026</text>

    <text x="600" y="500" font-size="44" font-weight="bold" fill="#FFFFFF" fill-opacity="0.92">11 of them Star Wars</text>
    <text x="600" y="556" font-size="34" fill="#FFFFFF" fill-opacity="0.66">library now 25 &#183; 4 with achievements</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="690" font-size="30" fill="#FFFFFF" fill-opacity="0.5">64MB for everything, and a 480i television</text>
    <text x="600" y="820" font-size="26" letter-spacing="4" fill="#FFFFFF" fill-opacity="0.4">BACKDROP</text>
  </g>
</svg>
