<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="GIMP retires XCF after 30 years">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#2E1040"/>
      <stop offset="100%" stop-color="#7621B0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B600A8"/>
      <stop offset="100%" stop-color="#7621B0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- faint layer-stack motif -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3">
    <rect x="150" y="560" width="900" height="120"/>
    <rect x="185" y="600" width="900" height="120"/>
    <rect x="220" y="640" width="900" height="120"/>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="600" y="150" font-size="32" letter-spacing="9" fill="#FFFFFF" fill-opacity="0.55" font-weight="bold">GIMP · DEV UPDATE</text>

    <text x="600" y="360" font-size="230" font-weight="900" fill="#FFFFFF" font-family="Arial Black, Arial, Helvetica, sans-serif">30</text>
    <text x="600" y="420" font-size="46" letter-spacing="6" fill="#FFFFFF" fill-opacity="0.7" font-weight="bold">YEARS OF XCF</text>

    <text x="600" y="480" font-size="34" fill="#FFFFFF" fill-opacity="0.5" font-weight="bold">A NEW PROJECT FORMAT IS COMING</text>
  </g>

  <rect x="500" y="510" width="200" height="8" rx="4" fill="url(#accent)"/>
</svg>
