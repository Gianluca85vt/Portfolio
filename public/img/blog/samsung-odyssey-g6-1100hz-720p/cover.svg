<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="1,100Hz only at 720p — Samsung Odyssey G6">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="62%" stop-color="#3B1060"/>
      <stop offset="100%" stop-color="#7621B0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>

  <g font-family="Inter, Helvetica Neue, Arial, sans-serif">
    <text x="80" y="122" fill="#C79BE8" font-size="27" font-weight="600" letter-spacing="5.5">SAMSUNG ODYSSEY G6 / G60H</text>

    <text x="80" y="322" fill="#FFFFFF" font-size="196" font-weight="800" letter-spacing="-6">1,100Hz</text>
    <text x="80" y="410" fill="#E6B8FF" font-size="70" font-weight="700" letter-spacing="-1.5">only at 1280 × 720</text>

    <rect x="80" y="470" width="150" height="4" fill="#B600A8"/>

    <text x="80" y="556" fill="#FFFFFF" font-size="35" font-weight="600">HD 1,100Hz</text>
    <text x="470" y="556" fill="#F0DCFF" font-size="35" font-weight="700">1.01 Gpx/s</text>

    <text x="80" y="614" fill="#FFFFFF" font-size="35" font-weight="600">QHD 600Hz</text>
    <text x="470" y="614" fill="#F0DCFF" font-size="35" font-weight="700">2.21 Gpx/s</text>

    <text x="80" y="682" fill="#C79BE8" font-size="31" font-weight="500">The slower mode moves twice the pixels.</text>
  </g>
</svg>
