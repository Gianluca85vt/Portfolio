<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="48-inch model, 8-foot LED volume">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#2A1E52"/>
      <stop offset="100%" stop-color="#5B3FBF"/>
    </linearGradient>
    <linearGradient id="accent4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B3FBF"/>
      <stop offset="100%" stop-color="#B9A6FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg4)"/>

  <!-- LED panel grid, wrapping a small object -->
  <g stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2">
    <path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200M0 630H1200"/>
    <path d="M120 0V900M240 0V900M360 0V900M480 0V900M600 0V900M720 0V900M840 0V900M960 0V900M1080 0V900"/>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="600" y="175" font-size="28" letter-spacing="7" fill="#FFFFFF" fill-opacity="0.55"
          font-weight="bold">THE MANDALORIAN AND GROGU</text>

    <text x="600" y="340" font-size="118" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">48"</text>
    <text x="600" y="405" font-size="30" letter-spacing="3" fill="#FFFFFF" fill-opacity="0.6"
          font-weight="bold">RAZOR CREST MODEL</text>

    <text x="600" y="495" font-size="30" fill="#FFFFFF" fill-opacity="0.5" font-weight="bold">
      LIT INSIDE AN 8-FOOT LED CUBE
    </text>
  </g>

  <rect x="500" y="545" width="200" height="8" rx="4" fill="url(#accent4)"/>
</svg>
