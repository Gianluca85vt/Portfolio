<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="The Moon on a Rainy Night: the hands are the budget">
  <defs>
    <linearGradient id="bgAmayo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="58%" stop-color="#5A3A09"/>
      <stop offset="100%" stop-color="#C8891B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgAmayo)"/>

  <!-- rain, falling at a slight angle -->
  <g stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="2">
    <line x1="140" y1="40" x2="110" y2="150"/>
    <line x1="330" y1="10" x2="300" y2="120"/>
    <line x1="520" y1="60" x2="490" y2="170"/>
    <line x1="760" y1="20" x2="730" y2="130"/>
    <line x1="980" y1="55" x2="950" y2="165"/>
    <line x1="1120" y1="15" x2="1090" y2="125"/>
    <line x1="230" y1="620" x2="200" y2="730"/>
    <line x1="880" y1="650" x2="850" y2="760"/>
  </g>

  <!-- a moon, mostly occluded -->
  <circle cx="1010" cy="250" r="96" fill="#FFE3AE" fill-opacity="0.17"/>
  <circle cx="1046" cy="226" r="96" fill="#18011F" fill-opacity="0.55"/>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="600" y="132" font-size="27" letter-spacing="7" fill="#FFFFFF" fill-opacity="0.52">THE MOON ON A RAINY NIGHT</text>
    <text x="600" y="286" font-size="104" fill="#FFFFFF">THE HANDS</text>
    <text x="600" y="396" font-size="104" fill="#FFE3AE">ARE THE BUDGET</text>
    <text x="600" y="476" font-size="31" letter-spacing="3" fill="#FFFFFF" fill-opacity="0.72">CompTown &#183; premiere window 2027</text>
  </g>

  <line x1="380" y1="540" x2="820" y2="540" stroke="#FFE3AE" stroke-opacity="0.5" stroke-width="3"/>
  <text x="600" y="606" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#FFFFFF" fill-opacity="0.6">No sign-language supervisor in either staff reveal</text>
</svg>
