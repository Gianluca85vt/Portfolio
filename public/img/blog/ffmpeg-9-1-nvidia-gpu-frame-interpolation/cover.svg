<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="FFmpeg 9.1 ships fruc_vulkan, GPU frame interpolation held back three and a half years by a licence">
  <defs>
    <linearGradient id="bgFRUC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="58%" stop-color="#361055"/>
      <stop offset="100%" stop-color="#7621B0"/>
    </linearGradient>
    <linearGradient id="accFRUC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D8A6FF"/>
      <stop offset="100%" stop-color="#7621B0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgFRUC)"/>

  <!-- faint motion-vector field -->
  <g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2" fill="none">
    <path d="M70 648 l54 -22"/><path d="M160 660 l54 -26"/><path d="M250 672 l54 -30"/>
    <path d="M340 684 l54 -34"/><path d="M430 694 l54 -36"/><path d="M520 702 l54 -38"/>
    <path d="M70 712 l50 -16"/><path d="M160 724 l50 -20"/><path d="M250 736 l50 -24"/>
    <path d="M340 746 l50 -28"/><path d="M430 756 l50 -30"/><path d="M520 764 l50 -32"/>
  </g>

  <!-- eyebrow -->
  <text x="90" y="138" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700"
        letter-spacing="7" fill="#D8A6FF" fill-opacity="0.95">FFMPEG 9.1 &#183; 20 NOV 2026</text>

  <!-- key phrase, top half -->
  <text x="90" y="302" font-family="Helvetica, Arial, sans-serif" font-size="150" font-weight="700"
        fill="#FFFFFF">fruc_vulkan</text>
  <text x="90" y="438" font-family="Helvetica, Arial, sans-serif" font-size="150" font-weight="700"
        fill="url(#accFRUC)">AT LAST</text>

  <rect x="92" y="484" width="340" height="9" fill="#D8A6FF" fill-opacity="0.9"/>

  <text x="90" y="568" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="400"
        fill="#FFFFFF" fill-opacity="0.92">Written in 2023. Held back by a licence.</text>

  <!-- two real frames, one invented between them -->
  <g>
    <rect x="690" y="640" width="130" height="96" fill="#FFFFFF" fill-opacity="0.82"/>
    <rect x="845" y="640" width="130" height="96" fill="#FFFFFF" fill-opacity="0.16" stroke="#D8A6FF" stroke-opacity="0.85" stroke-width="3" stroke-dasharray="10 8"/>
    <rect x="1000" y="640" width="130" height="96" fill="#FFFFFF" fill-opacity="0.82"/>
  </g>
  <text x="690" y="800" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700"
        letter-spacing="3" fill="#FFFFFF" fill-opacity="0.8">REAL &#183; INFERRED &#183; REAL</text>
  <text x="690" y="848" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="400"
        letter-spacing="2" fill="#D8A6FF" fill-opacity="0.85">AMPERE AND NEWER</text>
</svg>
