<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Control Resonant review: verdicts run from 4 to 10">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#18011F"/>
      <stop offset="1" stop-color="#7A1FA2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#g)"/>
  <text x="90" y="150" font-family="Helvetica, Arial, sans-serif" font-size="34" letter-spacing="6" fill="#D9B8E8">CONTROL RESONANT</text>
  <text x="90" y="340" font-family="Helvetica, Arial, sans-serif" font-size="190" font-weight="700" fill="#FFFFFF">4 to 10</text>
  <text x="90" y="420" font-family="Helvetica, Arial, sans-serif" font-size="44" fill="#E7D3F0">eight verdicts, averaging 7.5</text>
  <rect x="90" y="470" width="640" height="4" fill="#D9B8E8" opacity="0.55"/>
