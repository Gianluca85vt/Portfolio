<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Netflix closes Night School Studio, maker of Oxenfree, six weeks after its last release">
  <defs>
    <linearGradient id="bgNS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#3A0F2E"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
    <linearGradient id="accentNS" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D6294E"/>
      <stop offset="100%" stop-color="#FFB199"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgNS)"/>

  <!-- parallax hills, a nod to Oxenfree's layered mattes -->
  <path d="M0 560 Q 200 500 420 550 T 820 540 T 1200 570 V 900 H 0 Z" fill="#FFFFFF" fill-opacity="0.05"/>
  <path d="M0 620 Q 220 580 460 615 T 900 600 T 1200 630 V 900 H 0 Z" fill="#FFFFFF" fill-opacity="0.08"/>
  <path d="M0 690 Q 260 650 500 685 T 950 670 T 1200 695 V 900 H 0 Z" fill="#FFFFFF" fill-opacity="0.12"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="150" font-size="28" letter-spacing="7" fill="#FFFFFF" fill-opacity="0.5" font-weight="bold">NETFLIX GAMES</text>

    <text x="600" y="290" font-size="88" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">NIGHT SCHOOL</text>
    <text x="600" y="365" font-size="60" font-weight="900" fill="#FFFFFF" fill-opacity="0.85"
          font-family="Arial Black, Arial, Helvetica, sans-serif">STUDIO CLOSED</text>

    <text x="600" y="430" font-size="30" fill="#FFFFFF" fill-opacity="0.6" font-weight="bold">
      SIX WEEKS AFTER ITS LAST RELEASE
    </text>
  </g>

  <rect x="500" y="470" width="200" height="8" rx="4" fill="url(#accentNS)"/>
</svg>
