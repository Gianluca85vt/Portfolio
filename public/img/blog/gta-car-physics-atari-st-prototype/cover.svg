<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="GTA's car physics started as an Atari ST demo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#18011F"/>
      <stop offset="1" stop-color="#7621B0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <g fill="#F4ECFA" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="80" y="150" font-size="34" letter-spacing="6" opacity="0.72">GFA BASIC, ATARI ST</text>
    <text x="80" y="330" font-size="150" font-weight="700">One weekend</text>
    <text x="80" y="440" font-size="64" font-weight="500" opacity="0.92">August 1996</text>
    <text x="80" y="530" font-size="38" opacity="0.78">The rigid body that drove Grand Theft Auto</text>
  </g>
  <rect x="80" y="585" width="190" height="5" fill="#F4ECFA" opacity="0.5"/>
</svg>
