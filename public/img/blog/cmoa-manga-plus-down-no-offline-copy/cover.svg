<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Comic Cmoa breach: 4.2 million records, a week offline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#18011F"/>
      <stop offset="1" stop-color="#C2185B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <text x="90" y="150" font-family="Helvetica, Arial, sans-serif" font-size="34" letter-spacing="6" fill="#F3C6D8">MANGA</text>
  <text x="90" y="330" font-family="Helvetica, Arial, sans-serif" font-size="210" font-weight="700" fill="#FFFFFF">4.2M</text>
  <text x="90" y="410" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="600" fill="#FFFFFF">records exposed at Comic Cmoa</text>
  <text x="90" y="480" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#F3C6D8">Offline since 15 October. No reopening date.</text>
  <rect x="90" y="530" width="300" height="4" fill="#FFFFFF" opacity="0.55"/>
  <text x="90" y="600" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#F3C6D8">MANGA Plus, Magazine Pocket and K MANGA</text>
  <text x="90" y="645" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#F3C6D8">went down six days later for a PHP patch</text>
</svg>
