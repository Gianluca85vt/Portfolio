<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Metal Gear Solid Master Collection Vol 2 review score 9.0 out of 10, three eras of hardware">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#5A1330"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="140" font-size="22" letter-spacing="6" fill="#FFFFFF" fill-opacity="0.55" font-weight="bold">
      REVIEW ROUNDUP
    </text>

    <text x="600" y="230" font-size="38" font-weight="900" fill="#FFFFFF">MGS MASTER COLLECTION VOL. 2</text>

    <text x="600" y="440" font-size="220" font-weight="900" fill="#FFFFFF">9.0</text>
    <text x="600" y="500" font-size="26" fill="#FFFFFF" fill-opacity="0.6" font-weight="bold">
      AVERAGE OF 5 CRITIC SCORES
    </text>
  </g>

  <!-- three eras: GBC tile block, PSP handheld silhouette, PS3-era widescreen frame -->
  <g fill="#FFFFFF" fill-opacity="0.12">
    <rect x="150" y="600" width="180" height="140" rx="6"/>
    <rect x="510" y="580" width="200" height="160" rx="16"/>
    <rect x="870" y="590" width="220" height="150" rx="4"/>
  </g>
  <g stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3" fill="none">
    <rect x="150" y="600" width="180" height="140" rx="6"/>
    <rect x="510" y="580" width="200" height="160" rx="16"/>
    <rect x="870" y="590" width="220" height="150" rx="4"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.45" font-size="18" font-weight="bold">
    <text x="240" y="770">GBC, 2000</text>
    <text x="610" y="770">PSP, 2010</text>
    <text x="980" y="770">PS3, 2008</text>
  </g>

  <text x="600" y="850" font-size="24" fill="#FFFFFF" fill-opacity="0.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    MGS4 finally off PS3, eighteen years later
  </text>
</svg>
