<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="OpenAI: Zero Data Retention for frontier models">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#4A0F52"/>
      <stop offset="100%" stop-color="#B600A8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7621B0"/>
      <stop offset="100%" stop-color="#B600A8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- a padlock outline: content sealed, keys held by the customer -->
  <g stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="4" fill="none">
    <rect x="120" y="120" width="90" height="70" rx="8"/>
    <path d="M138 120 v-14 a27 27 0 0 1 54 0 v14"/>
    <rect x="990" y="120" width="90" height="70" rx="8"/>
    <path d="M1008 120 v-14 a27 27 0 0 1 54 0 v14"/>
  </g>

  <g text-anchor="middle">
    <text x="600" y="150" font-size="30" letter-spacing="9" fill="#FFFFFF" fill-opacity="0.55"
          font-family="Arial, Helvetica, sans-serif" font-weight="bold">OPENAI · 20 AUG 2026</text>

    <text x="600" y="360" font-size="300" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">ZDR</text>

    <text x="600" y="450" font-size="34" letter-spacing="4" fill="#FFFFFF" fill-opacity="0.60"
          font-family="Arial, Helvetica, sans-serif" font-weight="bold">ZERO DATA RETENTION</text>

    <text x="600" y="500" font-size="27" letter-spacing="2" fill="#FFFFFF" fill-opacity="0.50"
          font-family="Arial, Helvetica, sans-serif" font-weight="bold">FOR FRONTIER MODELS · PRIVATE SAFETY PROCESSING</text>
  </g>

  <rect x="500" y="545" width="200" height="8" rx="4" fill="url(#accent)"/>
</svg>
