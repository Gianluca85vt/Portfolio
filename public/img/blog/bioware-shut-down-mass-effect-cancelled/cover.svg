<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="BioWare shut down, next Mass Effect cancelled">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18011F"/>
      <stop offset="1" stop-color="#D6294E"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#FFFFFF">
    <text x="80" y="150" font-size="34" opacity="0.72" letter-spacing="6">GAMES — 22 OCTOBER 2026</text>
    <text x="80" y="340" font-size="190" font-weight="700">50 of 400</text>
    <text x="80" y="430" font-size="52" font-weight="600" opacity="0.95">EA closes BioWare after 30 years</text>
    <text x="80" y="502" font-size="40" opacity="0.78">Next Mass Effect cancelled in early development</text>
  </g>
</svg>
