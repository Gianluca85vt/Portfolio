<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Unity bought Synty Studios: 60,000 low-poly assets in one style">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18011F"/>
      <stop offset="0.55" stop-color="#2A1133"/>
      <stop offset="1" stop-color="#E87D0D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E87D0D"/>
      <stop offset="1" stop-color="#FFD79A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- low-poly facets, the Synty silhouette language: flat planes, no shading detail -->
  <g fill="#FFD79A" fill-opacity="0.10" stroke="#FFD79A" stroke-opacity="0.18" stroke-width="2">
    <polygon points="96,742 236,676 300,796 150,852"/>
    <polygon points="300,796 430,712 512,818 372,866"/>
    <polygon points="512,818 640,730 742,806 604,868"/>
    <polygon points="742,806 876,700 988,790 848,860"/>
    <polygon points="988,790 1104,702 1150,806 1040,856"/>
  </g>
  <g fill="none" stroke="#FFD79A" stroke-opacity="0.22" stroke-width="2">
    <polygon points="236,676 300,796 430,712"/>
    <polygon points="640,730 742,806 876,700"/>
  </g>

  <text x="90" y="178" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="5" fill="#FFD79A" fill-opacity="0.85">UNITY BOUGHT SYNTY</text>

  <text x="90" y="372" font-family="Helvetica, Arial, sans-serif" font-size="186" font-weight="700" fill="#FFFFFF">60,000+</text>
  <text x="90" y="470" font-family="Helvetica, Arial, sans-serif" font-size="78" font-weight="700" fill="url(#accent)">assets, one style</text>

  <rect x="90" y="516" width="190" height="6" fill="url(#accent)"/>

  <text x="90" y="590" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="400" fill="#FFFFFF" fill-opacity="0.82">Headed into Unity Spark's closed beta.</text>
  <text x="90" y="640" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="400" fill="#FFFFFF" fill-opacity="0.62">Licences and pricing hold, for now.</text>
</svg>
