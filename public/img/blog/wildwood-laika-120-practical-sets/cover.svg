<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Wildwood: 120 practical sets, 231 puppets">
  <defs>
    <linearGradient id="bgWW" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#241A45"/>
      <stop offset="100%" stop-color="#5B3FBF"/>
    </linearGradient>
    <linearGradient id="accentWW" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B3FBF"/>
      <stop offset="100%" stop-color="#B600A8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgWW)"/>

  <!-- silhouetted trees, hand-planted rather than scattered -->
  <g fill="#000000" fill-opacity="0.35">
    <path d="M90 900 L90 620 L60 640 L90 560 L55 585 L95 470 L135 585 L100 560 L130 640 L100 620 L100 900 Z"/>
    <path d="M230 900 L230 560 L190 585 L230 480 L185 510 L235 370 L285 510 L240 480 L280 585 L240 560 L240 900 Z"/>
    <path d="M1020 900 L1020 610 L985 632 L1020 545 L980 572 L1025 440 L1070 572 L1030 545 L1065 632 L1030 610 L1030 900 Z"/>
    <path d="M1150 900 L1150 650 L1120 668 L1150 600 L1115 622 L1155 520 L1195 622 L1160 600 L1190 668 L1160 650 L1160 900 Z"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="170" font-size="30" letter-spacing="9" fill="#FFFFFF" fill-opacity="0.5"
          font-weight="bold">LAIKA · WILDWOOD</text>

    <text x="600" y="330" font-size="150" font-weight="900" fill="#FFFFFF">120</text>
    <text x="600" y="390" font-size="32" fill="#FFFFFF" fill-opacity="0.55" font-weight="bold"
          letter-spacing="4">PRACTICAL SETS BUILT BY HAND</text>

    <text x="600" y="500" font-size="70" font-weight="900" fill="#FFFFFF" fill-opacity="0.9">231 PUPPETS</text>
    <text x="600" y="545" font-size="28" fill="#FFFFFF" fill-opacity="0.5" font-weight="bold"
          letter-spacing="3">NOT ONE INSTANCED</text>
  </g>

  <rect x="500" y="600" width="200" height="8" rx="4" fill="url(#accentWW)"/>
</svg>
