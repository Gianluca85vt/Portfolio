<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Shader compilation stutter, fixed before you press play">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#3A0E22"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- broken/stalled progress bar motif -->
  <g stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2">
    <path d="M0 120H1200M0 240H1200"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="185" font-size="30" letter-spacing="6" fill="#FFFFFF" fill-opacity="0.55"
          font-weight="bold">COMPILING SHADERS</text>

    <text x="600" y="370" font-size="118" font-weight="900" fill="#FFFFFF">0 STUTTER</text>

    <text x="600" y="440" font-size="32" fill="#FFFFFF" fill-opacity="0.5" font-weight="bold">
      MODERN WARFARE 4 — PRELOADED BEFORE YOU PLAY
    </text>
  </g>

  <!-- stalled progress bar, frozen mid-fill -->
  <rect x="300" y="520" width="600" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.12"/>
  <rect x="300" y="520" width="230" height="18" rx="9" fill="#D6294E"/>
  <rect x="300" y="520" width="230" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.15"/>
</svg>
