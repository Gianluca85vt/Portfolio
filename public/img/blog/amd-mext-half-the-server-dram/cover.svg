<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="AMD MEXT: 95 percent of server performance on half the DRAM">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18011F"/>
      <stop offset="1" stop-color="#1D4E63"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#g)"/>
  <text x="80" y="150" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#7FD6E8" letter-spacing="6">AMD MEXT</text>
  <text x="80" y="330" font-family="Helvetica, Arial, sans-serif" font-size="210" font-weight="700" fill="#FFFFFF">95%</text>
