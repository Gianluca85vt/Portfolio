<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="The Witcher 3 Remastered, second overhaul in four years">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#3A0F22"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2">
    <path d="M0 150H1200M0 300H1200M0 450H1200"/>
    <path d="M150 0V900M450 0V900M750 0V900M1050 0V900"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="160" font-size="30" letter-spacing="8" fill="#FFFFFF" fill-opacity="0.5" font-weight="bold">THE WITCHER 3 — REMASTERED</text>

    <text x="600" y="360" font-size="150" font-weight="900" fill="#FFFFFF">2nd</text>
    <text x="600" y="430" font-size="34" fill="#FFFFFF" fill-opacity="0.55" font-weight="bold">FREE OVERHAUL SINCE 2022</text>

    <rect x="480" y="470" width="240" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.35"/>

    <text x="600" y="560" font-size="42" fill="#FFFFFF" fill-opacity="0.85" font-weight="bold">GLOBAL ILLUMINATION</text>
    <text x="600" y="605" font-size="42" fill="#FFFFFF" fill-opacity="0.85" font-weight="bold">REBUILT FROM SCRATCH</text>

    <text x="600" y="720" font-size="30" fill="#FFFFFF" fill-opacity="0.4" font-weight="bold">SEPTEMBER 29, 2026</text>
  </g>
</svg>
