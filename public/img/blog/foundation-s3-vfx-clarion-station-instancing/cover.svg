<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Foundation season 3, Clarion Station VFX breakdown">
  <defs>
    <linearGradient id="bgFoundation" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#2A1A55"/>
      <stop offset="100%" stop-color="#5B3FBF"/>
    </linearGradient>
    <linearGradient id="accentFoundation" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B3FBF"/>
      <stop offset="100%" stop-color="#B600A8"/>
    </linearGradient>
    <radialGradient id="glowFoundation" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFD9A0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFD9A0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgFoundation)"/>

  <!-- distant stars -->
  <g fill="#FFFFFF">
    <circle cx="90" cy="120" r="2" opacity="0.6"/>
    <circle cx="180" cy="60" r="1.5" opacity="0.5"/>
    <circle cx="1080" cy="90" r="2" opacity="0.6"/>
    <circle cx="1000" cy="180" r="1.5" opacity="0.4"/>
    <circle cx="140" cy="250" r="1.5" opacity="0.4"/>
    <circle cx="1120" cy="260" r="1.5" opacity="0.5"/>
  </g>

  <!-- rotating station ring, lower half, cropped by card overlay -->
  <circle cx="600" cy="900" r="520" fill="none" stroke="#0B000F" stroke-opacity="0.55" stroke-width="90"/>
  <circle cx="600" cy="900" r="520" fill="none" stroke="url(#accentFoundation)" stroke-opacity="0.4" stroke-width="4"/>
  <circle cx="600" cy="900" r="430" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="600" cy="900" r="610" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>

  <!-- scattered instanced structures along the ring, top edge -->
  <g fill="#0B000F" fill-opacity="0.6">
    <rect x="330" y="378" width="10" height="26"/>
    <rect x="360" y="368" width="8" height="34"/>
    <rect x="395" y="374" width="12" height="28"/>
    <rect x="430" y="366" width="9" height="36"/>
    <rect x="470" y="372" width="10" height="30"/>
    <rect x="720" y="372" width="10" height="30"/>
    <rect x="760" y="366" width="9" height="36"/>
    <rect x="795" y="374" width="12" height="28"/>
    <rect x="830" y="368" width="8" height="34"/>
    <rect x="860" y="378" width="10" height="26"/>
  </g>

  <circle cx="600" cy="900" r="380" fill="url(#glowFoundation)"/>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="600" y="200" font-size="24" letter-spacing="7" fill="#FFFFFF" fill-opacity="0.55">FOUNDATION — SEASON 3</text>

    <text x="600" y="300" font-size="88" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">5KM STATION</text>
    <text x="600" y="365" font-size="34" fill="#FFFFFF" fill-opacity="0.7">BUILT AS A WORKING VEHICLE</text>

    <text x="600" y="430" font-size="26" fill="#FFFFFF" fill-opacity="0.55">
      ~1,000 VFX SHOTS · FRAMESTORE + RODEO FX
    </text>
  </g>

  <rect x="500" y="465" width="200" height="8" rx="4" fill="url(#accentFoundation)"/>
</svg>
