<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="8.2 million polygons per frame">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#3D0B1E"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D6294E"/>
      <stop offset="100%" stop-color="#BE4C00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- faint tri-mesh, standing in for a Nanite cluster grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2">
    <path d="M0 150H1200M0 300H1200M0 450H1200M0 600H1200"/>
    <path d="M0 90 L1200 330M0 330 L1200 90M0 240 L1200 480M0 480 L1200 240"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="150" font-size="30" letter-spacing="8" fill="#FFFFFF" fill-opacity="0.55"
          font-weight="bold">TIDES OF ANNIHILATION</text>

    <text x="600" y="330" font-size="150" font-weight="900" fill="#FFFFFF">8.2M</text>

    <text x="600" y="400" font-size="34" fill="#FFFFFF" fill-opacity="0.5" font-weight="bold">
      POLYGONS PER FRAME, CLAIMED
    </text>

    <text x="600" y="450" font-size="34" fill="#FFFFFF" fill-opacity="0.5" font-weight="bold">
      ON A TOOL NOT BUILT FOR THIS
    </text>
  </g>

  <rect x="500" y="500" width="200" height="8" rx="4" fill="url(#accent)"/>
</svg>
