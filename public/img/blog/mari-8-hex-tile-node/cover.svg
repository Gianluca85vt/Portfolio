<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Mari 8's hex tile node costs three texture taps per pixel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#1E2547"/>
      <stop offset="100%" stop-color="#2E6BA8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5FA8FF"/>
      <stop offset="100%" stop-color="#A6D8FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <g fill="none" stroke="#5FA8FF" stroke-opacity="0.18" stroke-width="3">
    <polygon points="960,120 1020,155 1020,225 960,260 900,225 900,155"/>
    <polygon points="1080,190 1140,225 1140,295 1080,330 1020,295 1020,225"/>
    <polygon points="960,260 1020,295 1020,365 960,400 900,365 900,295"/>
    <polygon points="840,190 900,225 900,295 840,330 780,295 780,225"/>
  </g>
  <text x="90" y="200" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#A6D8FF" letter-spacing="6">3D · TEXTURING</text>
  <text x="90" y="340" font-family="Helvetica, Arial, sans-serif" font-size="150" font-weight="700" fill="url(#accent)">3 taps</text>
  <text x="90" y="420" font-family="Helvetica, Arial, sans-serif" font-size="46" fill="#E8EEF8">per pixel, to kill the repeat</text>
  <text x="90" y="510" font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#9FB2CC">Mari 8.0 beta adds a Hex Tile node</text>
  <rect x="90" y="560" width="220" height="5" fill="#5FA8FF"/>
</svg>
