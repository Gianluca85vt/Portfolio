<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="NHL 27 review: seven verdicts spread from 5 to 8, mean 7">
  <defs>
    <linearGradient id="bgNhl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#5A1030"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
    <linearGradient id="accNhl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D6294E"/>
      <stop offset="100%" stop-color="#FF8FA6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgNhl)"/>

  <text x="90" y="128" fill="#FFB3C1" font-family="Helvetica, Arial, sans-serif" font-size="28" letter-spacing="8">NHL 27 — SEVEN VERDICTS</text>

  <text x="86" y="330" fill="#FFFFFF" font-family="Helvetica, Arial, sans-serif" font-size="200" font-weight="700" letter-spacing="-4">5 → 8</text>

  <text x="92" y="400" fill="#FFD9E1" font-family="Helvetica, Arial, sans-serif" font-size="34">a three-point spread, mean 6.77</text>

  <!-- score plot: seven verdicts along a 5-to-8 axis -->
  <line x1="92" y1="500" x2="1108" y2="500" stroke="url(#accNhl)" stroke-width="3" opacity="0.75"/>
  <g fill="#FFFFFF">
    <circle cx="92" cy="500" r="15"/>
    <circle cx="431" cy="500" r="15"/>
    <circle cx="769" cy="500" r="15"/>
    <circle cx="769" cy="500" r="15"/>
    <circle cx="1074" cy="500" r="15"/>
    <circle cx="1108" cy="500" r="15"/>
    <circle cx="600" cy="500" r="15"/>
  </g>
  <line x1="692" y1="462" x2="692" y2="538" stroke="#FFD9E1" stroke-width="4"/>
  <text x="668" y="578" fill="#FFD9E1" font-family="Helvetica, Arial, sans-serif" font-size="24">mean</text>

  <text x="92" y="660" fill="#FFFFFF" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="600">The commentary EA expanded</text>
  <text x="92" y="712" fill="#FFFFFF" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="600">with generative AI voice</text>
  <text x="92" y="790" fill="#FFB3C1" font-family="Helvetica, Arial, sans-serif" font-size="26" letter-spacing="3">OPENCRITIC 64 · 31% RECOMMEND · 13 CRITICS</text>
