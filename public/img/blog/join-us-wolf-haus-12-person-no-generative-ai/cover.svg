<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="A twelve-person studio building a large-scale open world without generative AI">
  <defs>
    <linearGradient id="bgJoin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#6E1030"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgJoin)"/>

  <!-- twelve tiles: modular kit pieces standing in for a twelve-person team -->
  <g stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3" fill="none">
    <rect x="90" y="120" width="70" height="70"/>
    <rect x="170" y="120" width="70" height="70"/>
    <rect x="250" y="120" width="70" height="70"/>
    <rect x="90" y="200" width="70" height="70"/>
    <rect x="170" y="200" width="70" height="70"/>
    <rect x="250" y="200" width="70" height="70"/>
    <rect x="960" y="120" width="70" height="70"/>
    <rect x="1040" y="120" width="70" height="70"/>
    <rect x="960" y="200" width="70" height="70"/>
    <rect x="1040" y="200" width="70" height="70"/>
    <rect x="960" y="280" width="70" height="70"/>
    <rect x="1040" y="280" width="70" height="70"/>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="600" y="380" font-size="30" letter-spacing="8" fill="#FFFFFF" fill-opacity="0.5">TWELVE PEOPLE</text>
    <text x="600" y="480" font-size="92" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">NO GENERATIVE AI</text>
    <text x="600" y="560" font-size="30" fill="#FFFFFF" fill-opacity="0.6">ONE OPEN WORLD</text>
  </g>

  <rect x="500" y="610" width="200" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.55"/>
</svg>
