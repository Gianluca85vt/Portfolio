<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="GPT-5.6 Ultrafast mode running at 750 tokens per second">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#4A0850"/>
      <stop offset="100%" stop-color="#B600A8"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7621B0"/>
      <stop offset="100%" stop-color="#B600A8"/>
