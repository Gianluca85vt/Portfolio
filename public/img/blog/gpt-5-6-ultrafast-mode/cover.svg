    <line x1="-40" y1="190" x2="300" y2="190"/>
    <line x1="-40" y1="240" x2="420" y2="240"/>
    <line x1="820" y1="140" x2="1240" y2="140"/>
    <line x1="900" y1="190" x2="1240" y2="190"/>
    <line x1="780" y1="240" x2="1240" y2="240"/>
  </g>

  <g text-anchor="middle">
    <text x="600" y="180" font-size="32" letter-spacing="8" fill="#FFFFFF" fill-opacity="0.55"
          font-family="Arial, Helvetica, sans-serif" font-weight="bold">GPT-5.6 SOL · ULTRAFAST</text>

    <text x="600" y="400" font-size="200" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">14X</text>

    <text x="600" y="470" font-size="32" letter-spacing="3" fill="#FFFFFF" fill-opacity="0.55"
