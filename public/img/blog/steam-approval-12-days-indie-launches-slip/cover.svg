<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Steam build approvals now take up to 12 business days">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18011F"/>
      <stop offset="1" stop-color="#D6294E"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <g fill="#FFFFFF" font-family="Helvetica, Arial, sans-serif">
    <text x="90" y="150" font-size="34" opacity="0.72" letter-spacing="6">STEAM BUILD REVIEW</text>
    <text x="90" y="340" font-size="210" font-weight="700">12 days</text>
    <text x="90" y="420" font-size="44" opacity="0.88">up from the usual three to five</text>
    <text x="90" y="500" font-size="30" opacity="0.6">and a failed build goes back to the end of the queue</text>
  </g>
</svg>
