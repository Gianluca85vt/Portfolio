<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Floyd Norman accepts an honorary Oscar, 70 years after joining Disney">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#2E1A5C"/>
      <stop offset="100%" stop-color="#5B3FBF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- pegbar holes, as on an animation sheet -->
  <g fill="#FFFFFF" fill-opacity="0.10">
    <circle cx="500" cy="92" r="17"/>
    <rect x="585" y="79" width="44" height="26" rx="13"/>
    <circle cx="700" cy="92" r="17"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="206" font-size="27" letter-spacing="8" fill="#FFFFFF" fill-opacity="0.58"
          font-weight="bold">HONORARY OSCAR</text>

    <text x="600" y="330" font-size="94" font-weight="900" fill="#FFFFFF">FLOYD NORMAN</text>

    <text x="600" y="440" font-size="62" font-weight="900" fill="#FFFFFF" fill-opacity="0.92">1959 &#8594; 2001</text>

    <text x="600" y="520" font-size="36" fill="#FFFFFF" fill-opacity="0.80">Sleeping Beauty to Monsters, Inc.</text>
  </g>

  <!-- three board panels, bottom -->
  <g stroke="#FFFFFF" stroke-opacity="0.22" fill="none" stroke-width="3">
    <rect x="300" y="640" width="180" height="101" rx="5"/>
    <rect x="510" y="640" width="180" height="101" rx="5"/>
    <rect x="720" y="640" width="180" height="101" rx="5"/>
  </g>
  <text x="600" y="800" font-family="Arial, Helvetica, sans-serif" text-anchor="middle"
        font-size="30" fill="#FFFFFF" fill-opacity="0.66">The one job the pipeline never took</text>
</svg>
