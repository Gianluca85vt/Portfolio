<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="House of the Dragon, Battle of the Gullet">
  <defs>
    <linearGradient id="bgGullet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#241148"/>
      <stop offset="100%" stop-color="#5B3FBF"/>
    </linearGradient>
    <linearGradient id="accentGullet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B3FBF"/>
      <stop offset="100%" stop-color="#B600A8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgGullet)"/>

  <!-- faint waterline grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2">
    <path d="M0 620H1200M0 660H1200M0 700H1200M0 740H1200"/>
  </g>

  <!-- dragon wing, simplified silhouette, upper right -->
  <g fill="#FFFFFF" fill-opacity="0.07">
    <path d="M760 60 C 900 40, 1040 90, 1120 190 C 1030 160, 940 150, 860 175 C 930 195, 990 235, 1030 290 C 940 260, 860 250, 790 270 C 830 220, 800 130, 760 60 Z"/>
  </g>

  <!-- ship silhouettes, low on the horizon -->
  <g fill="#0B000F" fill-opacity="0.55">
    <path d="M120 660 L160 590 L200 660 Z"/>
    <path d="M90 662 L230 662 L210 690 L110 690 Z"/>
    <path d="M960 640 L1000 560 L1040 640 Z"/>
    <path d="M930 642 L1070 642 L1050 675 L950 675 Z"/>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="600" y="330" font-size="30" letter-spacing="9" fill="#FFFFFF" fill-opacity="0.5">HOUSE OF THE DRAGON — SEASON 3</text>

    <text x="600" y="470" font-size="118" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">THE GULLET</text>

    <text x="600" y="540" font-size="32" fill="#FFFFFF" fill-opacity="0.55">
      DRAGONS, SHIPS, AND A PEPSI CHALLENGE
    </text>
  </g>

  <rect x="500" y="580" width="200" height="8" rx="4" fill="url(#accentGullet)"/>
</svg>
