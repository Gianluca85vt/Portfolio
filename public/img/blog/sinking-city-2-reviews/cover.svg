<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="The Sinking City 2 review score 8 out of 10, flooded city corridor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#5A1330"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D6294E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#18011F" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="150" font-size="24" letter-spacing="6" fill="#FFFFFF" fill-opacity="0.55" font-weight="bold">
      REVIEW ROUNDUP
    </text>

    <text x="600" y="280" font-size="46" font-weight="900" fill="#FFFFFF">THE SINKING CITY 2</text>

    <text x="600" y="470" font-size="220" font-weight="900" fill="#FFFFFF">8.0</text>
    <text x="600" y="530" font-size="28" fill="#FFFFFF" fill-opacity="0.6" font-weight="bold">
      AVERAGE OF 7 CRITIC SCORES
    </text>
  </g>

  <!-- flooded street silhouette, waterline reflection -->
  <g fill="#FFFFFF" fill-opacity="0.12">
    <rect x="80" y="600" width="140" height="260"/>
    <rect x="240" y="560" width="110" height="300"/>
    <rect x="370" y="620" width="160" height="240"/>
    <rect x="660" y="580" width="130" height="280"/>
    <rect x="810" y="540" width="100" height="320"/>
    <rect x="930" y="610" width="190" height="250"/>
  </g>
  <rect x="0" y="700" width="1200" height="200" fill="url(#water)"/>
  <g stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3">
    <line x1="0" y1="700" x2="1200" y2="700"/>
  </g>

  <text x="600" y="850" font-size="26" fill="#FFFFFF" fill-opacity="0.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    drowned Arkham, corridor by corridor
  </text>
</svg>
