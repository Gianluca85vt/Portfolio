<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Pakeezah 4K: restored without its camera negative">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18011F"/>
      <stop offset="1" stop-color="#5B3FBF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <g fill="#FFFFFF" font-family="Helvetica, Arial, sans-serif">
    <text x="80" y="140" font-size="34" opacity="0.72" letter-spacing="6">FILM &amp; TV</text>
    <text x="80" y="330" font-size="190" font-weight="700">4K</text>
    <text x="80" y="420" font-size="54" font-weight="600" opacity="0.95">from a melted negative</text>
    <text x="80" y="500" font-size="38" opacity="0.78">Pakeezah, 1972 &#183; rebuilt from</text>
    <text x="80" y="552" font-size="38" opacity="0.78">an interpositive and a print</text>
  </g>
  <g opacity="0.3" fill="#FFFFFF">
    <rect x="80" y="640" width="1040" height="2"/>
  </g>
  <text x="80" y="712" fill="#FFFFFF" font-family="Helvetica, Arial, sans-serif" font-size="30" opacity="0.6">Two years at L&#8217;Immagine Ritrovata, Bologna</text>
</svg>
