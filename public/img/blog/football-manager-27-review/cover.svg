<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Football Manager 27 repairs what FM26 broke">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#3A0F1E"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- faint pitch markings -->
  <g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3" fill="none">
    <path d="M90 170H1110M90 560H1110M600 170V560"/>
    <circle cx="600" cy="365" r="86"/>
    <path d="M90 250H230V480H90"/>
    <path d="M1110 250H970V480H1110"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="120" font-size="26" letter-spacing="8" fill="#FFFFFF" fill-opacity="0.55"
          font-weight="bold">FOOTBALL MANAGER 27</text>

    <text x="600" y="300" font-size="150" font-weight="900" fill="#FFFFFF">8.0</text>
    <text x="600" y="368" font-size="34" font-weight="900" fill="#FFFFFF" fill-opacity="0.92">FOUR VERDICTS &#183; 7.5 TO 8.9</text>

    <text x="600" y="470" font-size="27" fill="#FFFFFF" fill-opacity="0.6" font-weight="bold">
      GRADED AGAINST FM26, NOT AGAINST FM24
    </text>
  </g>

  <!-- small discs, the year's visible work -->
  <g fill="#FFFFFF" fill-opacity="0.75">
    <circle cx="470" cy="700" r="9"/>
    <circle cx="520" cy="672" r="9"/>
    <circle cx="566" cy="716" r="9"/>
    <circle cx="624" cy="686" r="9"/>
    <circle cx="676" cy="724" r="9"/>
    <circle cx="730" cy="694" r="9"/>
  </g>
  <circle cx="598" cy="748" r="5" fill="#FFD84D"/>
</svg>
