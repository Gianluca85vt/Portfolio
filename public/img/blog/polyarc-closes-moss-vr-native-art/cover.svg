<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Polyarc closes after eleven years and two Moss games">
  <defs>
    <linearGradient id="bgPoly" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#123024"/>
      <stop offset="100%" stop-color="#2F7D52"/>
    </linearGradient>
    <linearGradient id="accPoly" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2F7D52"/>
      <stop offset="100%" stop-color="#A8E6B8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgPoly)"/>

  <!-- an open diorama box, drawn in perspective -->
  <g stroke="#A8E6B8" stroke-opacity="0.22" stroke-width="2.5" fill="none">
    <polygon points="330,640 870,640 760,760 440,760"/>
    <line x1="330" y1="640" x2="330" y2="560"/>
    <line x1="870" y1="640" x2="870" y2="560"/>
    <line x1="440" y1="760" x2="440" y2="690"/>
    <line x1="760" y1="760" x2="760" y2="690"/>
  </g>
  <g stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5">
    <line x1="330" y1="560" x2="870" y2="560"/>
    <line x1="600" y1="600" x2="600" y2="720"/>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="600" y="150" font-size="28" letter-spacing="8" fill="#FFFFFF" fill-opacity="0.45">POLYARC, 2015-2026</text>

    <text x="600" y="300" font-size="150" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">29</text>
    <text x="600" y="375" font-size="44" fill="#FFFFFF" fill-opacity="0.85">PEOPLE, TWO MOSS GAMES</text>

    <text x="600" y="450" font-size="34" fill="#FFFFFF" fill-opacity="0.6">AND A VR ART DISCIPLINE WITH NOWHERE TO GO</text>
  </g>

  <rect x="500" y="500" width="200" height="8" rx="4" fill="url(#accPoly)"/>
</svg>
