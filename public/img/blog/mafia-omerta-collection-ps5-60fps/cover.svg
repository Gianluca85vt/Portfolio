<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Mafia Definitive Edition, 60fps on PS5">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#3A0A22"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D6294E"/>
      <stop offset="100%" stop-color="#FF7A4D"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2">
    <path d="M0 150H1200M0 300H1200M0 450H1200M0 600H1200"/>
    <path d="M150 0V900M300 0V900M450 0V900M600 0V900M750 0V900M900 0V900M1050 0V900"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="160" font-size="30" letter-spacing="8" fill="#FFFFFF" fill-opacity="0.55" font-weight="bold">
      MAFIA: DEFINITIVE EDITION
    </text>

    <text x="600" y="400" font-size="220" font-weight="900" fill="#FFFFFF">60fps</text>

    <text x="600" y="470" font-size="34" fill="#FFFFFF" fill-opacity="0.5" font-weight="bold">
      NATIVE PS5, FREE UPGRADE <tspan text-decoration="line-through">30fps</tspan>
    </text>
  </g>

  <rect x="500" y="520" width="200" height="8" rx="4" fill="url(#accent)"/>
</svg>
