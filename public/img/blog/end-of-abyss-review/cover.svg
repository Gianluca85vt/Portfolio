<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="End of Abyss averages 7.5 across eleven verdicts, from 6 to 9">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#18011F"/>
      <stop offset="1" stop-color="#D6294E"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#g)"/>
  <text x="80" y="150" fill="#ffffff" opacity="0.72" font-family="Helvetica,Arial,sans-serif" font-size="34" letter-spacing="6">END OF ABYSS</text>
  <text x="80" y="360" fill="#ffffff" font-family="Helvetica,Arial,sans-serif" font-size="230" font-weight="700">7.5</text>
  <text x="80" y="430" fill="#ffffff" opacity="0.82" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="600">eleven verdicts, 6 to 9</text>
  <text x="80" y="492" fill="#ffffff" opacity="0.55" font-family="Helvetica,Arial,sans-serif" font-size="30">the map was the argument</text>
</svg>
