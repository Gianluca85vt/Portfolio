<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Acer says RAM prices peak in mid-2027">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#3B1060"/>
      <stop offset="100%" stop-color="#7621B0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C77DFF"/>
      <stop offset="100%" stop-color="#EBD4FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- DIMM contact fingers along the lower edge, faint -->
  <g fill="#FFFFFF" fill-opacity="0.07">
    <rect x="70"  y="792" width="18" height="46"/><rect x="100" y="792" width="18" height="46"/>
    <rect x="130" y="792" width="18" height="46"/><rect x="160" y="792" width="18" height="60"/>
    <rect x="200" y="792" width="18" height="46"/><rect x="230" y="792" width="18" height="46"/>
    <rect x="260" y="792" width="18" height="46"/><rect x="290" y="792" width="18" height="60"/>
    <rect x="330" y="792" width="18" height="46"/><rect x="360" y="792" width="18" height="46"/>
    <rect x="390" y="792" width="18" height="46"/><rect x="420" y="792" width="18" height="60"/>
    <rect x="460" y="792" width="18" height="46"/><rect x="490" y="792" width="18" height="46"/>
    <rect x="520" y="792" width="18" height="46"/><rect x="550" y="792" width="18" height="60"/>
    <rect x="590" y="792" width="18" height="46"/><rect x="620" y="792" width="18" height="46"/>
    <rect x="650" y="792" width="18" height="46"/><rect x="680" y="792" width="18" height="60"/>
    <rect x="720" y="792" width="18" height="46"/><rect x="750" y="792" width="18" height="46"/>
    <rect x="780" y="792" width="18" height="46"/><rect x="810" y="792" width="18" height="60"/>
    <rect x="850" y="792" width="18" height="46"/><rect x="880" y="792" width="18" height="46"/>
    <rect x="910" y="792" width="18" height="46"/><rect x="940" y="792" width="18" height="60"/>
    <rect x="980" y="792" width="18" height="46"/><rect x="1010" y="792" width="18" height="46"/>
    <rect x="1040" y="792" width="18" height="46"/><rect x="1070" y="792" width="18" height="60"/>
  </g>

  <!-- price curve: up, plateau, down -->
  <path d="M90 690 L300 600 L520 470 L700 440 L860 452 L1110 600"
        fill="none" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="5"/>
  <circle cx="780" cy="441" r="11" fill="#EBD4FF" fill-opacity="0.8"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <text x="90" y="128" fill="#C77DFF" font-size="30" letter-spacing="8">ACER · DRAM · 20 SEPTEMBER 2026</text>
    <text x="84" y="300" fill="#FFFFFF" font-size="150" font-weight="bold">MID-2027</text>
    <text x="90" y="372" fill="#EBD4FF" font-size="44">is where Acer says RAM prices peak</text>
    <text x="90" y="432" fill="#FFFFFF" fill-opacity="0.72" font-size="34">“A shortage until 2030 is impossible”</text>
  </g>
</svg>
