<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Silent Hill Townfall: the fog used to hide the hardware, now it hides something else">
  <defs>
    <linearGradient id="bgSH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#6B1030"/>
      <stop offset="100%" stop-color="#D6294E"/>
    </linearGradient>
    <radialGradient id="fogGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentSH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D6294E"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgSH)"/>
  <rect width="1200" height="900" fill="url(#fogGlow)"/>

  <!-- fog bands -->
  <g fill="#FFFFFF">
    <ellipse cx="150" cy="560" rx="420" ry="60" fill-opacity="0.05"/>
    <ellipse cx="900" cy="610" rx="480" ry="70" fill-opacity="0.05"/>
    <ellipse cx="600" cy="670" rx="700" ry="90" fill-opacity="0.06"/>
    <ellipse cx="300" cy="730" rx="600" ry="80" fill-opacity="0.05"/>
    <ellipse cx="950" cy="760" rx="500" ry="70" fill-opacity="0.04"/>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="600" y="150" font-size="26" letter-spacing="7" fill="#FFFFFF" fill-opacity="0.55">SILENT HILL: TOWNFALL</text>

    <text x="600" y="290" font-size="92" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">THE FOG</text>

    <text x="600" y="360" font-size="40" font-weight="900" fill="#FFFFFF" fill-opacity="0.92"
          font-family="Arial Black, Arial, Helvetica, sans-serif">ISN'T HIDING DRAW DISTANCE</text>

    <text x="600" y="410" font-size="26" letter-spacing="3" fill="#FFFFFF" fill-opacity="0.6">IT'S HIDING THE UPSCALER NOW</text>
  </g>

  <rect x="500" y="450" width="200" height="8" rx="4" fill="url(#accentSH)"/>
</svg>
