<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="ArtStation and Sketchfab moving from Epic to KitBash">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18011F"/>
      <stop offset="55%" stop-color="#3A1A10"/>
      <stop offset="100%" stop-color="#BE4C00"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#BE4C00"/>
      <stop offset="100%" stop-color="#B600A8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg3)"/>

  <!-- kit pieces, stacking -->
  <g stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3" fill="none">
    <rect x="70" y="560" width="150" height="150"/>
    <rect x="140" y="620" width="150" height="150"/>
    <rect x="910" y="560" width="150" height="150"/>
    <rect x="980" y="620" width="150" height="150"/>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="600" y="150" font-size="32" letter-spacing="10" fill="#FFFFFF" fill-opacity="0.45">CHANGING HANDS</text>

    <text x="600" y="290" font-size="86" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">ARTSTATION</text>
    <text x="600" y="390" font-size="86" font-weight="900" fill="#FFFFFF"
          font-family="Arial Black, Arial, Helvetica, sans-serif">SKETCHFAB</text>

    <text x="600" y="480" font-size="46" fill="#FFFFFF" fill-opacity="0.55">EPIC</text>
  </g>

  <!-- arrow: epic to kitbash -->
  <g stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M600 505V555"/>
    <path d="M578 535l22 24 22-24"/>
  </g>

  <text x="600" y="625" text-anchor="middle" font-size="56" font-weight="900" fill="#FFFFFF"
        font-family="Arial Black, Arial, Helvetica, sans-serif">KITBASH</text>

  <rect x="500" y="660" width="200" height="8" rx="4" fill="url(#accent3)"/>
</svg>
