name: Media kit — refresh every Monday

# Rewrites src/data/media-kit.json from Search Console, beehiiv and Bluesky and
# commits it, which redeploys /media-kit/. Weekly is enough: the page is read by
# a vendor deciding whether to reply, not by someone watching a dashboard.
#
# It also runs when the script or this file changes, so the page has real
# numbers from the first push rather than waiting for the first Monday.

on:
  schedule:
    - cron: '0 5 * * 1'
  push:
    branches: [main]
    paths:
      - scripts/media-kit-data.mjs
      - .github/workflows/media-kit.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: media-kit
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install
        run: npm ci --silent --ignore-scripts

      - name: Gather the numbers
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
        run: node scripts/media-kit-data.mjs

      # Other jobs push to main all day; rebase onto theirs and retry rather
      # than fail on a race nobody can see.
      - name: Commit if anything changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/media-kit.json
          if git diff --cached --quiet; then
            echo "media kit unchanged"
            exit 0
          fi
          git commit -m "Refresh the media kit numbers"
          for i in 1 2 3 4; do
            git fetch -q origin main
            if git rebase -q origin/main && git push -q origin HEAD:main; then
              echo "pushed"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::could not push the media kit after four tries"
          exit 1
