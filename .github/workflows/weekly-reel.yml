name: Weekly breakdown Reel — Saturday

# One Reel a week instead of seven (growth plan, 5 October): the week's best
# 3D piece as a breakdown — what works, what does not, his reading — drawn as
# 9:16 frames and emailed with the caption. He posts it by hand as a photo
# Reel, because only the app can put a trending track under it.
#
# The frames go out as attachments, so nothing is committed and nothing waits
# for a deploy. 08:00 UTC is 10:00 in Rome in summer, 09:00 in winter.

on:
  schedule:
    - cron: '0 8 * * 6'
  workflow_dispatch:

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install
        run: npm install sharp --no-save --silent

      - name: Draw the Reel and email it
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
        run: node scripts/weekly-reel.mjs
