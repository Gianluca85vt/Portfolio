name: Published articles — post to Facebook and Instagram

# Fires on the same push that publishes an article, not on the schedule that
# writes them. The daily routine only ever produces `draft: true`; an article
# becomes public when Gianluca approves it from the review email, and that
# approval is what should reach the networks.
#
# Kept apart from notify-drafts.yml on purpose. That workflow sends the review
# email and pings IndexNow, and neither should be at the mercy of Meta having
# a bad afternoon.

on:
  # Meta's API is the least reliable dependency here. A run that fails halfway
  # needs to be repeatable by hand, and the ledger makes that safe: anything
  # already posted is skipped.
  workflow_dispatch:
    inputs:
      slug:
        description: 'Post one article by slug (leave empty to use the last push)'
        required: false

  push:
    branches: [main]
    paths:
      - 'src/content/blog/**.md'

permissions:
  contents: write

# Two pushes in quick succession must not race each other into a double post.
concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Enough history to diff the whole push rather than its last commit.
          fetch-depth: 50

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Work out what just went live
        id: pick
        # The dispatch input arrives as an environment variable rather than
        # being interpolated into the script, so a slug can never be read as
        # shell — and it is checked against the slug pattern before it is
        # written out, because every later step reads it back.
        env:
          MANUAL_SLUG: ${{ inputs.slug }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -n "${MANUAL_SLUG:-}" ]; then
            if ! printf '%s' "$MANUAL_SLUG" | grep -Eq '^[a-z0-9][a-z0-9-]{1,120}$'; then
              echo "::error::'$MANUAL_SLUG' is not a slug"
              exit 1
            fi
            echo "slugs=${MANUAL_SLUG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The whole push, not its last commit — the same range notify-drafts
          # uses, for the same reason. Diffing HEAD^ alone meant a push of two
          # publications posted only the second, with nothing in the log to
          # say the first had been passed over.
          if [ -n "${BEFORE:-}" ] \
            && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE $AFTER"
          elif git rev-parse "$AFTER^" >/dev/null 2>&1; then
            echo "::notice::no usable push range, falling back to the last commit"
            range="$AFTER^ $AFTER"
          else
            echo "slugs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "diffing $range"
          changed=$(git diff --name-only --diff-filter=AM $range -- 'src/content/blog/*.md' || true)

          live=""
          for file in $changed; do
            # Publishing is the removal of this line, so its absence is the
            # signal. A draft in the same push is simply passed over.
            if grep -q '^draft: true' "$file"; then
              continue
            fi

            slug=$(basename "$file" .md)

            # And skip anything already posted, here rather than four steps
            # later inside the poster. An edit to old articles — a title
            # rewrite, a typo fix — changes dozens of published files at once,
            # and without this the job installs a browser, redraws dozens of
            # cards and commits them, all to discover the ledger had every slug
            # already. One SEO pass over the archive did exactly that.
            if [ -f notes/social-posted.json ] && \
               grep -q "\"$slug\"[[:space:]]*:" notes/social-posted.json; then
              echo "skip $slug — already posted"
              continue
            fi

            live="$live $slug"
          done

          echo "slugs=$(echo $live | xargs)" >> "$GITHUB_OUTPUT"
          echo "to post:${live:- nothing}"

      - name: Install sharp
        if: steps.pick.outputs.slugs != ''
        run: npm install sharp --no-save

      - name: Draw the portrait cards
        if: steps.pick.outputs.slugs != ''
        env:
          SLUGS: ${{ steps.pick.outputs.slugs }}
        run: |
          set -euo pipefail
          for slug in $SLUGS; do
            node scripts/social-card.mjs "$slug"
          done

      # The link preview for /blog/ itself, redrawn here because this is the
      # step that knows something just went live. It carries the three newest
      # covers, so posting the blog on LinkedIn shows what published that
      # morning instead of a still from a 2024 Unreal video, which is what the
      # site-wide fallback was serving.
      - name: Redraw the blog's link preview
        if: steps.pick.outputs.slugs != ''
        run: node scripts/social-card.mjs --blog

      - name: Commit the cards
        if: steps.pick.outputs.slugs != ''
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/img/blog
          if git diff --cached --quiet; then
            echo "no new cards"
          else
            git commit -m "Draw the social cards and the blog's link preview"
            # Every push to main makes Vercel fetch the repository, even for a
            # commit its ignore step then skips. On 12 October the publish, this
            # commit and the ledger after it landed within a minute of each
            # other and of a draft commit; GitHub's secondary rate limit refused
            # Vercel's fetches and two deployments failed. So each push from
            # this job waits until 75 seconds after the one before it.
            since=$(git log -1 --format=%ct "$GITHUB_SHA")
            left=$(( since + 75 - $(date +%s) ))
            if [ "$left" -gt 0 ]; then echo "spacing the push: waiting ${left}s"; sleep "$left"; fi
            # Runs queue rather than cancel, so a second one starts from the
            # commit that triggered it and finds main has moved. A plain rebase
            # was not enough: this commit also redraws one shared picture, the
            # blog's link preview, and when two articles go live minutes apart
            # both runs redraw it. On 5 October the second rebase stopped on
            # that file and the editorial never reached Facebook or Instagram.
            #
            # The preview shows the newest covers, and this run started from
            # the newer commit, so on a clash its copy wins: -X theirs, since
            # in a rebase "theirs" is the commit being replayed. Retried,
            # because other jobs push to main too.
            pushed=0
            for attempt in 1 2 3 4; do
              git fetch -q origin main
              if git rebase --autostash -X theirs origin/main && git push origin HEAD:main; then
                pushed=1
                break
              fi
              git rebase --abort 2>/dev/null || true
              echo "push did not land, retrying ($attempt)"
              sleep $((RANDOM % 6 + 3))
            done
            [ "$pushed" = 1 ] || { echo "::error::could not push the cards after four attempts"; exit 1; }
            date +%s > "$RUNNER_TEMP/cards-pushed-at"
          fi

      # Instagram fetches the image from a URL rather than accepting an upload,
      # so the card has to be readable on the public internet before the post
      # is created. Pushing first is what makes the raw.githubusercontent URL
      # resolve; this pause is for GitHub's own CDN to catch up with the push.
      - name: Let the raw URLs settle
        if: steps.pick.outputs.slugs != ''
        run: sleep 20

      # The post links to the article, and Facebook reads its preview from the
      # page at the moment the post is made. This job starts on the same push
      # that publishes the piece, usually before Vercel has finished building
      # it, and on 12 October GitHub's rate limit made deployments fail
      # outright. So nothing is posted until every article answers 200. If one
      # is still missing after three minutes and a deploy hook is configured
      # (VERCEL_DEPLOY_HOOK, created in Vercel and stored as a GitHub secret),
      # the job asks Vercel for a fresh deployment once. After ten minutes it
      # stops without posting: a rerun from the Actions tab picks it up, and
      # the ledger keeps anything already posted from going out twice.
      - name: Wait until the articles are live
        if: steps.pick.outputs.slugs != ''
        env:
          SLUGS: ${{ steps.pick.outputs.slugs }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          set -uo pipefail
          start=$(date +%s)
          hooked=0
          for slug in $SLUGS; do
            url="https://www.gianlucascattarella.it/blog/$slug/"
            while :; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo 000)
              [ "$code" = 200 ] && { echo "live: $url"; break; }
              waited=$(( $(date +%s) - start ))
              if [ "$waited" -ge 180 ] && [ "$hooked" = 0 ] && [ -n "${VERCEL_DEPLOY_HOOK:-}" ]; then
                echo "still $code after ${waited}s, asking Vercel for a fresh deployment"
                curl -s -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null || true
                hooked=1
              fi
              if [ "$waited" -ge 600 ]; then
                echo "::error::$url still answers $code after ten minutes; nothing was posted. Check the Vercel deployment, then rerun this workflow."
                exit 1
              fi
              sleep 15
            done
          done

      - name: Post
        if: steps.pick.outputs.slugs != ''
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          # Bluesky is skipped until both are set (an app password, never the
          # account password).
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          SLUGS: ${{ steps.pick.outputs.slugs }}
        run: node scripts/social-post.mjs $SLUGS

      - name: Record what was posted
        if: steps.pick.outputs.slugs != ''
        env:
          SLUGS: ${{ steps.pick.outputs.slugs }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add notes/social-posted.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing posted, ledger unchanged"
          else
            # The ledger is JSON the evening story writes too. If the rebase
            # stops on it, start again from main's copy and lay this run's
            # entries over it as data (scripts/merge-ledger.mjs) rather than
            # as lines. The posts have already gone out by now, so losing this
            # record would mean posting them a second time.
            cp notes/social-posted.json "$RUNNER_TEMP/ledger-ours.json"
            git commit -m "Record the articles posted to Facebook and Instagram"
            # Spaced from the cards push for the same reason as that one.
            since=$(cat "$RUNNER_TEMP/cards-pushed-at" 2>/dev/null || echo 0)
            left=$(( since + 75 - $(date +%s) ))
            if [ "$left" -gt 0 ]; then echo "spacing the push: waiting ${left}s"; sleep "$left"; fi
            pushed=0
            for attempt in 1 2 3 4; do
              git fetch -q origin main
              if git rebase --autostash origin/main && git push origin HEAD:main; then
                pushed=1
                break
              fi
              git rebase --abort 2>/dev/null || true
              git reset -q --hard origin/main
              node scripts/merge-ledger.mjs "$RUNNER_TEMP/ledger-ours.json" notes/social-posted.json $SLUGS
              git add notes/social-posted.json
              git commit -q -m "Record the articles posted to Facebook and Instagram" || true
              echo "ledger merged onto main, retrying ($attempt)"
              sleep $((RANDOM % 6 + 3))
            done
            [ "$pushed" = 1 ] || { echo "::error::could not record the posts after four attempts"; exit 1; }
          fi
