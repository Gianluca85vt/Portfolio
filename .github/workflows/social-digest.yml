name: Daily story frames

# Draws the evening's frames at 19:00 Italian time and emails them. It does not
# publish them.
#
# The API cannot attach music. A story container takes an image or a video URL
# and nothing else — no audio, no stickers, no polls, no links — and no endpoint
# knows which track is trending either. On a story that costs little, since a
# story reaches people who already follow you. On a Reel it costs the whole
# point: trending audio is a discovery surface.
#
# So the frames go to him instead, and he posts them as a photo Reel with a
# track off the Trending tab, then reshares it to his story. Instagram lets each
# photo be dragged to land on the beat, which a fixed-timing video from here
# could not do.
#
# The feed still posts one article at a time from social-post.yml.

on:
  # Several slots, for two separate reasons. Italy is UTC+2 in summer and UTC+1
  # in winter, so a single fixed UTC cron would drift by an hour at the
  # changeover. And GitHub runs scheduled workflows on a best-effort basis: on
  # 2 September these fired at 19:38 and 20:33 rather than 17:00 and 18:00.
  #
  # Extra slots are free because the script refuses to post twice in a day.
  # 2 September proved the need: the 17:00 slot fired at 19:38.
  schedule:
    - cron: '0 17 * * *'
    - cron: '0 18 * * *'
    - cron: '0 20 * * *'

  workflow_dispatch:
    inputs:
      force:
        description: 'Draw the frames now, whatever the hour in Rome'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: social-digest
  cancel-in-progress: false

jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # One question, asked in the script rather than in bash: is the evening here
      # and has today's story not gone out? A step that demanded the hour be
      # exactly 19 could never pass on a run GitHub started at 21:38, which is
      # how a night went by with nothing posted.
      - name: Anything to draw?
        id: pick
        env:
          FORCE_DIGEST: ${{ inputs.force }}
        run: |
          set -euo pipefail
          slugs=$(node scripts/social-digest.mjs --plan)
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "in tonight's story:${slugs:- nothing}"

      - name: Install sharp
        if: steps.pick.outputs.slugs != ''
        run: npm install sharp --no-save

      - name: Draw the story frames
        if: steps.pick.outputs.slugs != ''
        run: node scripts/social-digest.mjs --draw

      - name: Commit the artwork
        if: steps.pick.outputs.slugs != ''
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/img/blog
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "Draw tonight's story"
            git pull --rebase --autostash
            git push
          fi

      # The frames are linked from the email and opened on a phone, so they have
      # to be live on the site before it sends. Vercel builds on the push above.
      - name: Let the deploy catch up
        if: steps.pick.outputs.slugs != ''
        run: sleep 60

      # Sent from the site, where the SMTP credentials already live, so an
      # unattended job never needs the mailbox password.
      - name: Email the frames
        if: steps.pick.outputs.slugs != ''
        run: |
          set -euo pipefail
          day=$(TZ=Europe/Rome date +%F)
          slugs=$(printf '%s' "${{ steps.pick.outputs.slugs }}" | tr ' ' '\n' \
            | grep -v '^$' | sed 's/.*/"&"/' | paste -sd, -)

          code=$(curl -s -o /tmp/out -w '%{http_code}' \
            -X POST https://www.gianlucascattarella.it/api/story-ready \
            -H 'content-type: application/json' \
            -d "{\"day\":\"$day\",\"slugs\":[$slugs]}") || true

          echo "HTTP $code — $(cat /tmp/out)"
          [ "$code" = "200" ] || echo "::warning::story-ready returned $code"

      - name: Record that the frames were made
        if: steps.pick.outputs.slugs != ''
        run: |
          set -euo pipefail
          node scripts/social-digest.mjs --record
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add notes/social-posted.json
          if git diff --cached --quiet; then
            echo "ledger unchanged"
          else
            git commit -m "Record tonight's frames"
            git pull --rebase --autostash
            git push
          fi
