name: Drafts — fetch images, then email for review

# Two jobs the scheduled writer cannot do itself, because its sandbox refuses
# outbound traffic to nearly every host: downloading the images it asked for,
# and calling the site to send the review email.
#
# They run in this order deliberately. The email should describe a draft that
# already has its artwork, not one that gets pictures a minute later.

on:
  # A manual trigger, because Actions occasionally drops a run at startup and
  # the images and the review email are then simply never produced. Re-running
  # from the Actions tab is the fix, and it needs this line to be offered.
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'src/content/blog/**.md'
      - 'notes/image-requests/**'

# Needed to push the fetched images back.
permissions:
  contents: write

jobs:
  drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Enough history to diff the whole push rather than its last commit.
          # See the range calculation below for why that matters.
          fetch-depth: 50

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install sharp for resizing
        run: npm install sharp --no-save

      - name: Fetch requested images
        run: node scripts/fulfil-image-requests.mjs

      - name: Commit anything fetched
        id: images
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/img/blog notes/image-requests src/content/blog 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "nothing fetched"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Fetch requested images for the pending drafts"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Email a review link for every draft added or revised
        run: |
          set -euo pipefail

          # The whole push, not its last commit.
          #
          # This used to diff exactly one commit — HEAD^ against HEAD, shifted
          # by one when the image step had pushed its own. Any push carrying
          # more than one commit that touched an article therefore had all but
          # the last one silently ignored: no IndexNow submission, no review
          # email, and nothing in the log to say a piece had been skipped. A
          # rebase before pushing is enough to produce that.
          #
          # github.event.before is the commit main was on before this push, and
          # github.sha is the commit that triggered the run — which is still the
          # right end of the range even after the image step pushed on top of
          # it, since that commit only ever adds artwork.
          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          if [ -n "$before" ] \
            && [ "$before" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$before^{commit}" 2>/dev/null; then
            range="$before $after"
          elif git rev-parse "$after^" >/dev/null 2>&1; then
            # A manual run, or a first push, or history shallower than the
            # range. One commit is the honest fallback.
            echo "::notice::no usable push range, falling back to the last commit"
            range="$after^ $after"
          else
            echo "No parent commit, nothing to compare."
            exit 0
          fi

          echo "diffing $range"
          changed=$(git diff --name-only --diff-filter=AM $range -- 'src/content/blog/*.md' || true)

          if [ -z "$changed" ]; then
            echo "No blog files added or modified."
            exit 0
          fi

          # Anything in this push that is NOT a draft has just gone live, so
          # tell Bing directly rather than waiting for it to come round. A
          # sitemap says "there is something here"; this says "read this now".
          live=""
          for file in $changed; do
            if ! grep -q '^draft: true' "$file"; then
              slug=$(basename "$file" .md)
              live="$live https://www.gianlucascattarella.it/blog/$slug/"
            fi
          done
          if [ -n "$live" ]; then
            node scripts/indexnow.mjs $live || echo "::warning::IndexNow call failed, continuing"
          fi

          for file in $changed; do
            # Only unpublished drafts are announced. Publishing removes this
            # line, so approving a piece never mails about it again.
            if ! grep -q '^draft: true' "$file"; then
              echo "skip (not a draft): $file"
              continue
            fi

            slug=$(basename "$file" .md)

            # Measure the things that make prose read as machine-written before
            # it reaches the review email: sentence rhythm, the setup-then-
            # reversal construction, filler connectives, bold density. Advisory
            # only — a piece can break any of these on purpose — but a draft
            # that trips several is worth another pass before approving.
            check=$(node scripts/prose-check.mjs "$file" 2>&1 || true)
            echo "$check"
            case "$check" in
              WARN*) echo "::warning::prose check flagged $slug — see the run log" ;;
            esac

            echo "notifying: $slug"

            code=$(curl -s -o /tmp/out -w '%{http_code}' \
              -X POST https://www.gianlucascattarella.it/api/draft-notify \
              -H 'content-type: application/json' \
              -d "{\"slug\":\"$slug\"}") || true

            echo "  HTTP $code — $(cat /tmp/out)"

            # A failed email must not fail the workflow: the draft is safely in
            # the repository, and a red cross here would suggest the push went
            # wrong when it did not.
            if [ "$code" != "200" ]; then
              echo "  ::warning::draft-notify returned $code for $slug"
            fi
          done
