name: Drafts — fetch images, then email for review

# Two jobs the scheduled writer cannot do itself, because its sandbox refuses
# outbound traffic to nearly every host: downloading the images it asked for,
# and calling the site to send the review email.
#
# They run in this order deliberately. The email should describe a draft that
# already has its artwork, not one that gets pictures a minute later.

on:
  # A manual trigger, because Actions occasionally drops a run at startup and
  # the images and the review email are then simply never produced. Re-running
  # from the Actions tab is the fix, and it needs this line to be offered.
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'src/content/blog/**.md'
      - 'notes/image-requests/**'

# Needed to push the fetched images back.
permissions:
  contents: write

jobs:
  drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install sharp for resizing
        run: npm install sharp --no-save

      - name: Fetch requested images
        run: node scripts/fulfil-image-requests.mjs

      - name: Commit anything fetched
        id: images
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/img/blog notes/image-requests src/content/blog 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "nothing fetched"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Fetch requested images for the pending drafts"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Email a review link for every draft added or revised
        run: |
          set -euo pipefail

          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "No parent commit, nothing to compare."
            exit 0
          fi

          # When this run committed images, the drafts to announce are the ones
          # from the push that triggered it, not from the image commit.
          if [ "${{ steps.images.outputs.pushed }}" = "true" ]; then
            range="HEAD^^ HEAD^"
          else
            range="HEAD^ HEAD"
          fi

          changed=$(git diff --name-only --diff-filter=AM $range -- 'src/content/blog/*.md' || true)

          if [ -z "$changed" ]; then
            echo "No blog files added or modified."
            exit 0
          fi

          for file in $changed; do
            # Only unpublished drafts are announced. Publishing removes this
            # line, so approving a piece never mails about it again.
            if ! grep -q '^draft: true' "$file"; then
              echo "skip (not a draft): $file"
              continue
            fi

            slug=$(basename "$file" .md)

            # Measure the things that make prose read as machine-written before
            # it reaches the review email: sentence rhythm, the setup-then-
            # reversal construction, filler connectives, bold density. Advisory
            # only — a piece can break any of these on purpose — but a draft
            # that trips several is worth another pass before approving.
            check=$(node scripts/prose-check.mjs "$file" 2>&1 || true)
            echo "$check"
            case "$check" in
              WARN*) echo "::warning::prose check flagged $slug — see the run log" ;;
            esac

            echo "notifying: $slug"

            code=$(curl -s -o /tmp/out -w '%{http_code}' \
              -X POST https://www.gianlucascattarella.it/api/draft-notify \
              -H 'content-type: application/json' \
              -d "{\"slug\":\"$slug\"}") || true

            echo "  HTTP $code — $(cat /tmp/out)"

            # A failed email must not fail the workflow: the draft is safely in
            # the repository, and a red cross here would suggest the push went
            # wrong when it did not.
            if [ "$code" != "200" ]; then
              echo "  ::warning::draft-notify returned $code for $slug"
            fi
          done
